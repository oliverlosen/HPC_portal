<!doctype html>
<html lang="es-GT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fc641b">
<title>Portal interno · HPC Smart Guide (prototipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#fc641b;--orange-hover:#e8550f;--orange-ink:#b4400b;--orange-soft:#fff1e8;
  --ink:#191c1d;--ink-2:#454c50;--muted:#677176;--line:#e3e6e7;--paper:#f4f5f5;--surface:#ffffff;--radius:14px;
  /* Gráficas: paleta de referencia de la guía de visualización, validada sobre #ffffff */
  --series-1:#2a78d6;--ord-1:#86b6ef;--ord-2:#3987e5;--ord-3:#256abf;--ord-4:#104281;
  --viz-text:#0b0b0b;--viz-text-2:#52514e;--viz-axis:#c3c2b7;
  --good:#006300;--bad:#d03b3b;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Manrope,"DM Sans",system-ui,sans-serif;margin:0;letter-spacing:-.01em;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--orange-ink)}
p{margin:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:8px 12px;border-radius:8px;z-index:70}
.skip-link:focus{left:8px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.icon{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 40px}
main:focus{outline:none}

/* Barra superior y aviso de prototipo */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:800 16px/1.1 Manrope,"DM Sans",sans-serif;color:var(--ink)}
.brand-mark{background:var(--orange);color:#fff;border-radius:9px;padding:5px 8px;font-size:14px;letter-spacing:.03em}
.brand small{display:block;font:600 10.5px/1.3 "DM Sans",sans-serif;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.mode-badge{display:inline-flex;align-items:center;gap:8px;background:var(--orange-soft);color:var(--orange-ink);border-radius:999px;padding:6px 12px;font-weight:600;font-size:12.5px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.demo{background:#fff8e6;border-bottom:1px solid #f1dfb2;color:#5a4300;font-size:12.5px}
.demo-in{max-width:1180px;margin:0 auto;padding:8px 20px;display:flex;gap:8px;align-items:flex-start}

/* Pestañas */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 0 16px}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}
.tab:hover{border-color:#c9cfd1}
.tab[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:#fff}
.count{background:var(--orange);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid transparent;padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2;text-align:center}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{background:var(--orange-hover)}
.btn-dark{background:var(--ink);color:#fff}
.btn-secondary{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-secondary:hover{border-color:#c2c8cb}
.btn-ghost{background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:#eceeef}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn-full{width:100%}
.link-btn{background:none;border:0;color:var(--ink-2);font-weight:600;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px;flex:none}
.icon-btn{background:none;border:1px solid transparent;border-radius:8px;padding:6px;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:#f3eded;color:#7a2e2e}

/* Estructura */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.section-title h2{font-size:21px;margin-top:2px}
.hint{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{color:var(--orange-ink);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:#c2c8cb}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.tag{display:inline-block;background:#eef1f2;border-radius:6px;padding:2px 8px;font-size:12px;color:var(--ink-2)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.badge-ok{background:#e7f4e7;color:#145214}
.badge-off{background:#f3eded;color:#7a2e2e}
.field{display:grid;gap:6px}
.field label,.field legend{font-weight:600;font-size:13px}
.input{width:100%;border:1px solid #cdd3d6;border-radius:10px;padding:10px 12px;background:#fff}
.input:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(25,28,29,.12)}
.form-error{background:#fbeceb;color:#8a1f1f;border-radius:10px;padding:10px 12px;font-size:13px}
.warn{display:inline-flex;gap:6px;align-items:center;color:#8a4b00;font-size:12px;margin-top:4px}
.warn .icon{width:15px;height:15px}
.empty{display:flex;gap:14px;align-items:flex-start}
.empty-state{text-align:center;display:grid;justify-items:center;gap:10px;padding:40px 20px}
.empty-state .icon{width:34px;height:34px;color:var(--orange)}
.points{margin:8px 0 0;padding-left:18px;display:grid;gap:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* Tablas */
.table-wrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;font-weight:600;color:var(--ink-2);background:#f8f9f9;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.table tr:last-child td{border-bottom:0}
.num,.table th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-actions{display:flex;gap:4px;flex-wrap:wrap}
.detail td{background:#fbfbfb}
.detail-box{display:grid;gap:10px}
.table.inner{border:1px solid var(--line);border-radius:8px}

/* Acceso */
.login-intro{max-width:720px;margin:10px 0 20px}
.login-intro h1{font-size:30px;margin:6px 0 8px}
.login-intro p{color:var(--ink-2);font-size:15px}
.login-grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start}
.login-card{display:grid;gap:14px}
.role-pick{border:0;padding:0;margin:0;display:grid;gap:8px}
.role-pick legend{margin-bottom:8px}
.role{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.role input{margin-top:3px;accent-color:var(--orange)}
.role.on{border-color:var(--orange);background:var(--orange-soft)}
.role strong{display:block}
.role small{display:block;color:var(--muted);font-size:12.5px}
.compare-table td:first-child{font-weight:600}

/* Atender cliente y productos */
.lookup-form{display:flex;gap:8px;margin:12px 0}
.lookup-form .input{max-width:360px}
.product-head{display:grid;grid-template-columns:160px minmax(0,1fr);gap:20px}
.product-img,.cat-img{background:#f6f6f4;border-radius:12px;display:grid;place-items:center;aspect-ratio:1/1;overflow:hidden}
.product-img img,.cat-img img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;padding:10px}
.brand-line{color:var(--orange-ink);font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.product h2{font-size:22px;margin:4px 0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px;margin:14px 0 0}
.facts div{min-width:0}
.facts dt{color:var(--muted);font-size:12px}
.facts dd{margin:2px 0 0;font-weight:600}
.facts.compact{grid-template-columns:1fr 1fr;gap:8px 12px;margin:10px 0}
.product-body{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.product-body h3,.alts h3{font-size:15px}
.profiles{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.profiles li{display:grid;gap:6px}
.alts{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.alt-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:10px}
.alt{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:2px}
.alt:hover{border-color:#c2c8cb}
.alt span{color:var(--muted);font-size:12.5px}
.filters{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1 1 260px;max-width:380px}
.search .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:38px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cat-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;background:#fff}
.cat-img{border-radius:0;aspect-ratio:16/10}
.cat-body{padding:14px;display:grid;gap:4px;align-content:start}
.cat-body h3{font-size:15px}
.talk summary{cursor:pointer;font-weight:600;font-size:13px;margin:4px 0 8px}

/* Pedido */
.order-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty-btn{border:0;background:#f4f5f5;width:32px;height:34px;cursor:pointer;font-size:16px}
.qty-input{width:52px;height:34px;border:0;text-align:center;-moz-appearance:textfield}
.qty-input::-webkit-outer-spin-button,.qty-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.order-summary h3{font-size:16px;margin-bottom:10px}
.sum{margin:0 0 16px;display:grid;gap:8px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum dt{color:var(--ink-2)}
.sum dd{margin:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.sum-total{border-top:1px solid var(--line);padding-top:10px;font-weight:700}

/* Métricas */
.metric-filters{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.metric-filters .label{font-weight:600;font-size:13px;margin-right:4px}
.kpis{display:grid;grid-template-columns:minmax(230px,1.5fr) repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.kpi .k-label{color:var(--viz-text-2);font-size:12.5px}
.kpi .k-value{font:700 28px/1.15 "DM Sans",system-ui,sans-serif;color:var(--viz-text);margin-top:6px}
.kpi .k-sub{color:var(--viz-text-2);font-size:12.5px;margin-top:2px}
.kpi.hero .k-value{font-size:52px;line-height:1.05}
.delta{font-size:12.5px;margin-top:6px;color:var(--viz-text-2)}
.delta.good{color:var(--good)}
.delta.bad{color:var(--bad)}
.viz-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.viz-card{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;min-width:0}
.viz-card.wide{grid-column:1/-1}
.viz-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.viz-head h3{font-size:15.5px}
.viz-head p{margin-top:2px;color:var(--viz-text-2);font-size:12.5px}
.bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(120px,34%) minmax(0,1fr);gap:12px;align-items:center}
.bar-label{color:var(--viz-text);font-size:13px;line-height:1.3;min-width:0}
.bar-label small{display:block;color:var(--viz-text-2);font-size:12px}
.bar-area{display:flex;align-items:center;min-height:30px;border-left:1px solid var(--viz-axis);border-radius:2px;cursor:default}
.bar{flex:none;height:18px;width:calc((100% - 84px) * var(--w));border-radius:0 4px 4px 0}
.bar-value{margin-left:8px;color:var(--viz-text);font-weight:600;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar-area:hover .bar,.bar-area:focus-visible .bar{filter:brightness(1.12)}
.data-table{margin-top:14px}
figcaption{margin-top:12px;color:var(--viz-text-2);font-size:12px}
.viz-tip{position:fixed;z-index:60;background:var(--ink);color:#fff;border-radius:8px;padding:7px 10px;font-size:12.5px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:260px}
.viz-tip strong{display:block;font-size:14px}
.viz-tip span{color:#d5dadc}
.att-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px;font-size:13px}
.att-list li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:6px}

.foot{margin-top:28px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;transition:.2s;pointer-events:none;z-index:80;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Resultado de la atención y reposición */
.inline-panel{margin-top:14px;border:1px solid var(--line);background:#fafbfb;border-radius:12px;padding:14px;display:grid;gap:10px}
.low-stock{display:flex;align-items:center;gap:6px;color:#8a4b00;font-size:12.5px;font-weight:600}
.low-stock .icon{width:16px;height:16px}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:#eef1f2;color:var(--ink-2)}
.status.pending{background:#fff4dc;color:#7a5200}
.status.done{background:#e7f4e7;color:#145214}
.status.off{background:#f3eded;color:#7a2e2e}

/* QR para anaquel */
.qr-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.qr-box{display:grid;justify-items:center;gap:12px;text-align:center}
.qr-box>svg{width:100%;max-width:260px;height:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.qr-link{word-break:break-all;font-size:12.5px;background:#f4f5f5;border-radius:8px;padding:8px 10px;width:100%;text-align:left}
#print-sheet{display:none}
@media print{
  body>*:not(#print-sheet){display:none!important}
  #print-sheet{display:block;text-align:center;color:#000;padding:24px;font-family:"DM Sans",system-ui,sans-serif}
  #print-sheet svg{width:70mm;height:70mm}
  #print-sheet h1{font-size:22pt;margin:10px 0}
}

/* Tiempo hasta la recomendación */
.time-stat{display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap;margin-bottom:12px}
.time-stat .k-value{font:700 32px/1 "DM Sans",system-ui,sans-serif;color:var(--viz-text)}
.time-stat .k-sub{color:var(--viz-text-2);font-size:12.5px}
.time-stat .delta{margin-top:0}

/* Atender sin celular: las preguntas de la guía */
.mode-switch{margin-top:10px}
.mode-switch .chip{padding:7px 14px;font-size:13px}
.questions{display:grid;gap:16px;margin-top:16px}
.q-group{border:0;margin:0;padding:0;min-width:0}
.q-group legend{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:0;margin-bottom:8px}
.q-n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:11.5px;flex:none}
.opt{position:relative;display:inline-flex}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.opt span{display:inline-flex;align-items:center;border:1px solid #cdd3d6;background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.opt span:hover{border-color:#9aa3a7}
.opt input:checked+span{border-color:var(--orange);background:var(--orange-soft);color:var(--orange-ink);font-weight:600}
.opt input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.assist-head{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.why-text{margin-top:8px;color:var(--ink-2)}

/* Servicio y garantía */
.contact-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.center-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:12px}
.center{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;align-content:start}
.center h3{font-size:15px;display:flex;align-items:center;gap:6px}
.center h3 .icon{color:var(--orange)}
.center .actions{margin-top:4px}
.warranty-points{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:12px}
.warranty-points div{background:#fafbfb;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.warranty-points h3{font-size:14px;margin-bottom:4px}
.faq{margin-top:12px}
.faq details{border-top:1px solid var(--line);padding:10px 0}
.faq summary{cursor:pointer;font-weight:600}
.faq p{margin-top:6px;color:var(--ink-2)}
.service-link{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.service-link .icon{width:16px;height:16px;color:var(--orange)}

/* Lo que se está acabando */
.low-list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.low-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.low-row{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.low-side{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stock-tag{font-weight:600;font-size:12.5px;color:#8a4b00;white-space:nowrap}
.stock-tag.out{color:#a52a2a}

/* Datos de este navegador */
.demo-link{color:#5a4300;font-size:12.5px;padding:0 0 0 4px}
.data-panel{margin-bottom:16px;border-color:#cdd3d6}
.data-panel h2{font-size:18px;margin-top:2px}
.data-counts{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.data-result{margin-top:12px;font-size:13px;border-radius:10px;padding:10px 12px;background:#e7f4e7;color:#145214}
.data-result.error{background:#fbeceb;color:#8a1f1f}

@media (max-width:900px){
  .login-grid,.order-layout,.viz-grid,.grid-2,.qr-layout{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .kpi.hero{grid-column:1/-1}
}
@media (max-width:560px){
  .wrap{padding:18px 16px 32px}
  .topbar-in,.demo-in{padding-left:16px;padding-right:16px}
  .mode-badge{order:3;width:100%;justify-content:center}
  .login-intro h1{font-size:24px}

  // Cada registro lleva un identificador propio para reconocerlo al pasar los datos a otra computadora.

  function barChart({id, title, subtitle, rows, colors, note, wide, stat}){

  }
  function kpi({label, value, prev, sub, hero, goodWhenUp=true, period}){
    let delta='';
    if(prev>0){

      delta=`<div class="delta ${cls}">${up?'▲':'▼'} ${pct(Math.abs(change))} vs. los ${period} días anteriores</div>`;
    }
    return `<div class="kpi${hero?' hero':''}"><div class="k-label">${esc(label)}</div><div class="k-value">${esc(fmt(value))}</div>${sub?`<div class="k-sub">${esc(sub)}</div>`:''}${delta}</div>`;
  }
  // stores: lista de tiendas o 'all'; from/to: días hacia atrás (desde hoy).

      if((stores!=='all'&&!stores.includes(r.store))||r.ago<from||r.ago>=to)continue;
      for(const k of ['scans','guides','recs','accepted','whatsapp','help','rejected'])z[k]+=r[k];
      for(const k in r.byCat)z.byCat[k]=(z.byCat[k]||0)+r.byCat[k];
      for(const k in r.byProduct)z.byProduct[k]=(z.byProduct[k]||0)+r.byProduct[k];
      r.reasons.forEach((v,i)=>{z.reasons[i]+=v;});

  function csv(orders){
    const q=v=>{const s=String(v??'');return /[",\n;]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;};

    const rows=orders.flatMap(o=>o.lines.map(l=>[o.id,localDate(new Date(o.createdAt)),o.status,o.point,o.date,l.code,l.model,l.name,l.boxes,l.units,l.unit.toFixed(2),l.disc,l.total.toFixed(2)]));

  function download(name, text){

  async function copyText(text){

  }

      const maxBoxes=Math.floor(WAREHOUSE[p.id]/BOX[p.id]), wanted=Math.ceil(Math.max(0,demand-stock)/BOX[p.id]);

  }

  // Generador de códigos QR sin dependencias: modo byte, corrección M, versiones 1 a 10

  const QR = (() => {

    function encode(text){
      const bytes=Array.from(new TextEncoder().encode(text));
      let v=1;for(;v<=10;v++)if(4+(v<10?8:16)+bytes.length*8<=dataCodewords(v)*8)break;
      if(v>10)throw new Error('El enlace es demasiado largo para el código QR; usa una dirección más corta.');

    function svg(text){
      const m=encode(text).modules,n=m.length,q=4;let d='';
      for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(m[y][x])d+=`M${x+q} ${y+q}h1v1h-1z`;
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*q} ${n+2*q}" shape-rendering="crispEdges" role="img" aria-label="Código QR del enlace"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
    }
    return {encode, svg};
  })();

  function exportData(){
    const s=state.session;
    const payload={formato:'hpc-portal-interno',version:1,exportado:new Date().toISOString(),
      desde:!s?'Pantalla de acceso':s.mode==='colaborador'?`Colaborador · ${storeName(s.store)}`:`Mayorista · ${account().name}`,
      requests:state.requests,orders:state.orders,attentions:state.attentions};

  // Suma registros de otra computadora. Lo repetido (mismo uid) no se duplica y gana el estado más avanzado:
  // una solicitud atendida o descartada, un pedido cancelado. Si el número ya existe aquí, el registro nuevo recibe otro.
  function mergeRecords(local, incoming, prefix, rank){
    const list=local.slice(), index=new Map(list.map((x,i)=>[x.uid,i])), res={added:0,updated:0,renamed:[]};
    const num=id=>parseInt(String(id).slice(2),10)||0;
    for(const x of incoming){
      const i=index.get(x.uid);
      if(i!==undefined){if(rank&&rank(x)>rank(list[i])){list[i]={...x,id:list[i].id};res.updated++;}continue;}
      let y=x;
      if(prefix&&list.some(z=>z.id===x.id)){y={...x,id:prefix+String(list.reduce((m,z)=>Math.max(m,num(z.id)),0)+1).padStart(4,'0')};res.renamed.push(`${x.id} → ${y.id}`);}
      list.push(y);index.set(y.uid,list.length-1);res.added++;
    }
    return {list,...res};
  }
  async function importData(file){
    let msg;
    try{
      if(file.size>5e6)throw new Error('El archivo es demasiado grande para ser una copia del portal.');
      let data;try{data=JSON.parse(await file.text());}catch{throw new Error('No se pudo leer el archivo: no es una copia del portal interno.');}
      if(!data||data.formato!=='hpc-portal-interno')throw new Error('El archivo no es una copia del portal interno.');
      const raw={r:asList(data.requests),o:asList(data.orders),a:asList(data.attentions)};
      const inc={r:raw.r.filter(validRequest).map(x=>withUid(x,'r')),o:raw.o.filter(validOrder).map(x=>withUid(x,'p')),a:raw.a.filter(validAttention).map(x=>withUid(x,'a'))};
      const ignored=raw.r.length+raw.o.length+raw.a.length-inc.r.length-inc.o.length-inc.a.length;
      const r=mergeRecords(state.requests,inc.r,'R-',x=>x.status==='pendiente'?0:1);
      const o=mergeRecords(state.orders,inc.o,'P-',x=>x.status==='cancelado'?1:0);
      const a=mergeRecords(state.attentions,inc.a);
      r.list.sort((x,y)=>x.at.localeCompare(y.at));o.list.sort((x,y)=>x.createdAt.localeCompare(y.createdAt));a.list.sort((x,y)=>x.at.localeCompare(y.at));
      const attentions=a.list.slice(-ATTENTION_LIMIT);
      if(!save('requests',r.list)||!save('orders',o.list)||!save('attentions',attentions))throw new Error('No se pudo guardar en este navegador.');
      state.requests=r.list;state.orders=o.list;state.attentions=attentions;
      const parts=[];
      if(r.added)parts.push(plural(r.added,'solicitud nueva','solicitudes nuevas'));
      if(r.updated)parts.push(plural(r.updated,'solicitud actualizada','solicitudes actualizadas'));
      if(o.added)parts.push(plural(o.added,'pedido nuevo','pedidos nuevos'));
      if(o.updated)parts.push(plural(o.updated,'pedido actualizado','pedidos actualizados'));
      if(a.added)parts.push(plural(a.added,'atención nueva','atenciones nuevas'));
      let text=parts.length?`Copia cargada: ${parts.join(', ')}.`:'La copia no traía nada nuevo: todo ya estaba en este navegador.';
      const renamed=[...r.renamed,...o.renamed];
      if(renamed.length)text+=` Cambiaron de número porque ese número ya existía aquí: ${renamed.join(', ')}.`;
      if(ignored)text+=` Se ${ignored===1?'ignoró':'ignoraron'} ${plural(ignored,'registro con datos incompletos','registros con datos incompletos')}.`;
      msg={text};
    }catch(e){msg={error:true,text:e&&e.message?e.message:'No se pudo cargar la copia.'};}
    state.dataMessage=msg;state.dataOpen=true;state.confirmReset=false;render();
    document.getElementById('data-panel')?.focus();
    toast(msg.text);
  }

  /* ---------- Render y eventos ---------- */
  const TITLES = {atender:'Atender cliente',productos:'Productos',catalogo:'Catálogo mayorista',pedido:'Nuevo pedido',pedidos:'Mis pedidos',reposicion:'Reposición',qr:'QR para anaquel',servicio:'Servicio y garantía',metricas:'Métricas'};
  function render(){
    tip.hidden = true;
    root.innerHTML = state.session ? shell(view()) : loginView();
    document.title = (state.session ? `${TITLES[state.tab]||'Portal'} · ` : '') + 'Portal interno · HPC Smart Guide (prototipo)';
    const active = document.querySelector('.tab[aria-current="page"]'), bar = active && active.parentElement;
    if(bar && bar.scrollWidth > bar.clientWidth) bar.scrollLeft += active.getBoundingClientRect().left - bar.getBoundingClientRect().left - (bar.clientWidth - active.offsetWidth) / 2;
  }
  function setTab(tab){state.tab=tab;state.orderError='';state.confirmCancel=null;state.attendFor=null;state.restockFor=null;state.dataOpen=false;state.confirmReset=false;state.dataMessage=null;render();window.scrollTo(0,0);document.getElementById('main')?.focus({preventScroll:true});}
  function persistDraft(){save('draft', state.draft);}
  function addLine(id){
    const line=state.draft.lines.find(l=>l.id===id);
    if(line)line.boxes=Math.min(999,line.boxes+1);else state.draft.lines.push({id,boxes:1});
    persistDraft();

  function setQty(id, n, refocus){
    const line=state.draft.lines.find(l=>l.id===id);if(!line)return;

  function login(){

    const session={mode,since:new Date().toISOString()};
    if(mode==='colaborador')session.store=state.loginStore;else session.account=state.loginAccount;
    if(!save('session',session))return;
    state.session=session;state.loginError='';state.search='';state.category='all';state.lookup='';state.storeFilter='mine';state.attendMode='codigo';state.answers={};

  document.addEventListener('click', e => {

    const id = b.dataset.id, a = b.dataset.action;

    else if(a==='attend-open'){state.attendFor=state.attendFor===id?null:id;state.restockFor=null;render();document.querySelector('[data-action="attend-save"]')?.focus();}
    else if(a==='attend-mode'){state.attendMode=b.dataset.mode;state.attendFor=null;state.restockFor=null;render();document.querySelector(`[data-action="attend-mode"][data-mode="${state.attendMode}"]`)?.focus();}
    else if(a==='answers-reset'){state.answers={};state.attendFor=null;state.restockFor=null;render();document.querySelector('input[name="q-project"]')?.focus();}
    else if(a==='attend-save'){
      // Sin producto cuando la muestra no cubre la necesidad (atención sin celular derivada a un asesor)
      const p=productById(id),entry={uid:newUid(),productId:p?p.id:null,code:p?p.code:'',store:state.session.store,at:new Date().toISOString(),outcome:b.dataset.outcome};
      if(b.dataset.chosen)entry.chosenId=b.dataset.chosen;
      if(state.attendMode==='preguntas'){const s=state.answers;entry.via='preguntas';entry.answers={project:s.project,material:s.material,frequency:s.frequency,priority:s.priority};}
      const list=[...state.attentions,entry].slice(-ATTENTION_LIMIT);
      if(save('attentions',list)){
        state.attentions=list;state.attendFor=null;if(entry.outcome==='sin-existencias'&&p)state.restockFor=p.id;
        render();if(state.restockFor)document.getElementById('restock-boxes')?.focus();
        toast(`Atención registrada: ${outcomeLabel(entry)}.${entry.outcome==='sin-existencias'?' Puedes pedir reposición aquí mismo.':''}`);
      }
    }
    else if(a==='restock-open'){state.restockFor=state.restockFor===id?null:id;state.attendFor=null;render();document.getElementById('restock-boxes')?.focus();}
    else if(a==='restock-close'){state.restockFor=null;render();}
    else if(a==='restock-accept'){
      const req=state.requests.find(r=>r.id===id);
      if(req&&req.status==='pendiente'){
        const list=state.requests.map(r=>r.id===id?{...r,status:'atendida',handledAt:new Date().toISOString(),account:state.session.account}:r);
        if(save('requests',list)){state.requests=list;addBoxes(req.productId,req.boxes);persistDraft();render();toast(`${req.id}: ${req.boxes} ${req.boxes===1?'caja agregada':'cajas agregadas'} a tu nuevo pedido.`);}
      }
    }
    else if(a==='restock-reject'){const list=state.requests.map(r=>r.id===id?{...r,status:'descartada',handledAt:new Date().toISOString(),account:state.session.account}:r);if(save('requests',list)){state.requests=list;render();toast(`Solicitud ${id} descartada.`);}}
    else if(a==='suggest-add'){const s=suggestions().find(x=>x.p.id===id);if(s){ensureBoxes(id,s.boxes);persistDraft();render();toast(`${s.p.name}: ${boxesInDraft(id)} ${boxesInDraft(id)===1?'caja':'cajas'} en el pedido.`);}}
    else if(a==='suggest-all'){const list=suggestions();list.forEach(s=>ensureBoxes(s.p.id,s.boxes));persistDraft();render();toast(`Se agregó lo sugerido: ${list.length} ${list.length===1?'producto':'productos'}.`);}
    else if(a==='qr-download'){const link=qrLink();if(link)downloadFile(qrFileName(),'<?xml version="1.0" encoding="UTF-8"?>\n'+QR.svg(link),'image/svg+xml');}
    else if(a==='qr-print')printLabel();
    else if(a==='data-open'){state.dataOpen=!state.dataOpen;state.confirmReset=false;state.dataMessage=null;render();if(state.dataOpen)document.getElementById('data-panel')?.focus();}
    else if(a==='data-close'){state.dataOpen=false;state.confirmReset=false;state.dataMessage=null;render();document.querySelector('[data-action="data-open"]')?.focus();}
    else if(a==='data-export')exportData();
    else if(a==='data-import')document.getElementById('data-file')?.click();
    else if(a==='data-reset-ask'){state.confirmReset=true;state.dataMessage=null;render();document.querySelector('[data-action="data-reset"]')?.focus();}
    else if(a==='data-reset-cancel'){state.confirmReset=false;render();document.querySelector('[data-action="data-reset-ask"]')?.focus();}
    else if(a==='data-reset')resetData();
    else if(a==='copy')copyText(b.dataset.text);
    else if(a==='category'){state.category=b.dataset.category;document.querySelectorAll('[data-action="category"]').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.category===state.category)));document.getElementById('results').innerHTML=results();}
    else if(a==='add-line')addLine(id);
    else if(a==='qty'){const line=state.draft.lines.find(l=>l.id===id);if(line)setQty(id,line.boxes+Number(b.dataset.delta),`[data-action="qty"][data-id="${id}"][data-delta="${b.dataset.delta}"]`);}
    else if(a==='remove-line'){const p=productById(id);state.draft.lines=state.draft.lines.filter(l=>l.id!==id);persistDraft();render();toast(`${p.name} se quitó del pedido.`);}
    else if(a==='clear-draft'){state.draft={lines:[],point:'',date:'',notes:''};persistDraft();render();toast('Pedido vaciado.');}
    else if(a==='view-order'){state.openOrder=state.openOrder===id?null:id;render();}
    else if(a==='repeat-order'){const o=state.orders.find(x=>x.id===id);state.draft.lines=o.lines.filter(l=>productById(l.id)).map(l=>({id:l.id,boxes:l.boxes}));persistDraft();setTab('pedido');toast(`Pedido ${id} copiado al nuevo pedido.`);}
    else if(a==='ask-cancel'){state.confirmCancel=id;render();document.querySelector(`[data-action="cancel-order"][data-id="${id}"]`)?.focus();}
    else if(a==='cancel-order'){const orders=state.orders.map(o=>o.id===id?{...o,status:'cancelado'}:o);if(save('orders',orders)){state.orders=orders;state.confirmCancel=null;render();toast(`Pedido ${id} cancelado.`);}}
    else if(a==='copy-order')copyText(orderText(state.orders.find(o=>o.id===id)));
    else if(a==='csv-order')download(`pedido-${id}.csv`,csv([state.orders.find(o=>o.id===id)]));
    else if(a==='csv-all')download('pedidos-demostracion.csv',csv(myOrders()));
    else if(a==='period'){state.period=Number(b.dataset.period);render();document.querySelector(`[data-action="period"][data-period="${state.period}"]`)?.focus();}
    else if(a==='toggle-table'){const t=document.getElementById(b.dataset.target),open=t.hidden;t.hidden=!open;b.setAttribute('aria-expanded',String(open));b.textContent=open?'Ocultar tabla':'Ver tabla';}
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if(t.name==='mode'){state.loginMode=t.value;state.loginError='';render();document.querySelector(`input[name="mode"][value="${t.value}"]`)?.focus();}
    else if(t.id==='login-store')state.loginStore=t.value;
    else if(t.id==='login-account')state.loginAccount=t.value;
    else if(t.id==='store-filter'){state.storeFilter=t.value;render();document.getElementById('store-filter')?.focus();}
    else if(t.dataset.qty)setQty(t.dataset.qty,parseInt(t.value,10),`[data-qty="${t.dataset.qty}"]`);
    else if(t.id==='o-point'){state.draft.point=t.value;persistDraft();}
    else if(t.id==='o-date'){state.draft.date=t.value;persistDraft();}
    else if(t.id==='qr-store'||t.id==='qr-category'||t.id==='qr-origin'){state.qr[t.id.slice(3)]=t.value;updateQr();}
    else if(t.name&&t.name.startsWith('q-')){
      // Respuestas de la atención sin celular; cambiar la necesidad borra el material, como en la guía
      const key=t.name.slice(2), before=answersComplete(state.answers)?(chooseProduct(state.answers)||{id:'ninguno'}).id:null;
      if(key==='project'&&state.answers.project!==t.value){state.answers={...state.answers,project:t.value};delete state.answers.material;}
      else state.answers={...state.answers,[key]:t.value};
      state.attendFor=null;state.restockFor=null;render();
      document.querySelector(`input[name="${t.name}"][value="${t.value}"]`)?.focus();
      if(answersComplete(state.answers)){const p=chooseProduct(state.answers);if((p?p.id:'ninguno')!==before)toast(p?`La guía recomienda: ${p.name} (${p.model}).`:'La muestra no tiene una opción para esta necesidad: deriva al cliente con un asesor de HPC.');}
    }
    else if(t.id==='data-file'){const f=t.files&&t.files[0];if(f)importData(f);}
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if(t.id==='search'){state.search=t.value;document.getElementById('results').innerHTML=results();}
    else if(t.id==='o-notes'){state.draft.notes=t.value;persistDraft();}
    else if(t.id==='qr-base'){state.qr.base=t.value;updateQr();}
  });
  document.addEventListener('submit', e => {
    e.preventDefault();
    if(e.target.id==='login-form')login();
    else if(e.target.id==='lookup-form'){state.lookup=document.getElementById('lookup').value;render();document.getElementById(findProduct(state.lookup)?'product-title':'lookup')?.focus();}
    else if(e.target.id==='order-form')confirmOrder();
    else if(e.target.id==='restock-form')submitRestock(e.target);
  });
  // Tooltip de las gráficas: el valor primero y la etiqueta después; también con el teclado.
  function showTip(el){
    tip.querySelector('strong').textContent=el.dataset.tipValue;tip.querySelector('span').textContent=el.dataset.tipLabel;tip.hidden=false;
    const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
    tip.style.left=Math.max(8,Math.min(r.left+Math.min(r.width,220)/2-w/2,innerWidth-w-8))+'px';
    tip.style.top=(r.top-h-8<8?r.bottom+8:r.top-h-8)+'px';
  }
  document.addEventListener('pointerover', e => {const el=e.target.closest('[data-tip-value]');if(el)showTip(el);});
  document.addEventListener('pointerout', e => {if(e.target.closest('[data-tip-value]'))tip.hidden=true;});
  document.addEventListener('focusin', e => {const el=e.target.closest('[data-tip-value]');if(el)showTip(el);else tip.hidden=true;});
  document.addEventListener('scroll', () => {tip.hidden=true;}, {passive:true});
  // Si una foto externa no carga, se muestra el icono de su categoría.
  document.addEventListener('error', e => {
    const im=e.target;if(!(im instanceof HTMLImageElement)||im.dataset.fallback)return;im.dataset.fallback='1';
    const p=productById(im.dataset.product);
    im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="120" height="120" fill="none" stroke="#e57b45" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="${ICONS[CATEGORY_ICON[p&&p.category]]||ICONS.box}"/></svg>`);
  }, true);

  window.HPC_PORTAL = {chooseProduct, reasonFor, candidatesFor, mergeRecords, totals, csv, aggregate, products:PRODUCTS, projects:PROJECTS, frequency:FREQUENCY, priority:PRIORITY, questions:QUESTIONS, support:SUPPORT, stores:STORES, qrCategories:QR_CATEGORY, qr:QR,
    suggestions:()=>state.session&&state.session.mode==='mayorista'?suggestions():[], version:GUIDE_VERSION};
  render();
})();
</script>
</body>
</html>
