<!doctype html>
<html lang="es-GT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fc641b">
<title>Portal interno · HPC Smart Guide (prototipo)</title>
<link rel="stylesheet" href="../dist/fonts.css">
<link rel="stylesheet" href="../dist/smart-guide.css">
<link rel="stylesheet" href="../dist/polish.css">
<style>
/* Mismo diseño que la guía de clientes (dist/styles.css): colores, letra, menú lateral y tarjetas.
   Modo oscuro: «Automático» sigue al equipo con prefers-color-scheme; Claro u Oscuro ponen data-theme en <html>.
   Todo color va por variable para que el modo oscuro cambie en un solo lugar. */
:root{color-scheme:light;
  --orange:#fc641b;--accent:#c2410c;--accent-hover:#a8380a;--accent-text:#c2410c;--accent-soft:#fff0e7;--on-accent:#fff;
  --ink:#191c1d;--ink-2:#454c50;--muted:#6b7173;--line:#e6e8e9;--line-2:#c9cfd1;--paper:#f7f8f8;--surface:#fff;--surface-2:#f8f9f9;--hover:#f2f4f4;
  --sidebar-bg:#fff;--topbar-bg:rgba(255,255,255,.94);--tag-bg:#eef1f2;--tag-ink:#454c50;--th-bg:#f8f9f9;--input-bg:#fff;--input-border:#cdd3d6;--photo:#f6f6f4;
  --ok-bg:#e7f4e7;--ok-ink:#145214;--off-bg:#f3eded;--off-ink:#7a2e2e;--warn-bg:#fff4dc;--warn-ink:#7a5200;--stock-low:#8a4b00;--stock-out:#a52a2a;--err-bg:#fbeceb;--err-ink:#8a1f1f;
  --demo-bg:#fff8e6;--demo-line:#f1dfb2;--demo-ink:#5a4300;--toast-bg:#202a2d;--tip-bg:#191c1d;--tip-sub:#d5dadc;--shade:#17242a77;--focus:#c2410c;
  /* Gráficas: paleta de referencia de la guía de visualización, validada sobre #ffffff (oscuro: sobre #1b1f20) */
  --series-1:#2a78d6;--ord-1:#86b6ef;--ord-2:#3987e5;--ord-3:#256abf;--ord-4:#104281;
  --viz-text:#0b0b0b;--viz-text-2:#52514e;--viz-axis:#c3c2b7;--good:#006300;--bad:#d03b3b;--goal-track:#e9ecec;
  --radius:13px;--sidebar:240px;--display:Manrope,"DM Sans",system-ui,sans-serif;--body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
:root[data-theme=dark]{color-scheme:dark;
  --accent:#fc641b;--accent-hover:#ff7a32;--accent-text:#ff8a4c;--accent-soft:#33221a;--on-accent:#191c1d;
  --ink:#eef1f1;--ink-2:#d0d6d8;--muted:#a3abae;--line:#2c3234;--line-2:#3a4245;--paper:#121516;--surface:#1b1f20;--surface-2:#22282a;--hover:#262c2e;
  --sidebar-bg:#171a1b;--topbar-bg:rgba(18,21,22,.94);--tag-bg:#262c2e;--tag-ink:#c5cbcd;--th-bg:#22282a;--input-bg:#121516;--input-border:#3a4245;--photo:#e9eded;
  --ok-bg:#16342b;--ok-ink:#8fe0b9;--off-bg:#3a1d16;--off-ink:#ffb4a6;--warn-bg:#3a2e14;--warn-ink:#f2c46b;--stock-low:#f2b25c;--stock-out:#ff8f85;--err-bg:#3a1d16;--err-ink:#ffa58c;
  --demo-bg:#2a2416;--demo-line:#4a3d1f;--demo-ink:#f0d9a0;--toast-bg:#2a3133;--tip-bg:#2a3133;--tip-sub:#c5cbcd;--shade:#000000a6;--focus:#ff8a4c;
  --series-1:#3987e5;--ord-1:#184f95;--ord-2:#256abf;--ord-3:#3987e5;--ord-4:#6da7ec;
  --viz-text:#f0efec;--viz-text-2:#c3c2b7;--viz-axis:#383835;--good:#0ca30c;--bad:#ff7b72;--goal-track:#2c3234}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
  --accent:#fc641b;--accent-hover:#ff7a32;--accent-text:#ff8a4c;--accent-soft:#33221a;--on-accent:#191c1d;
  --ink:#eef1f1;--ink-2:#d0d6d8;--muted:#a3abae;--line:#2c3234;--line-2:#3a4245;--paper:#121516;--surface:#1b1f20;--surface-2:#22282a;--hover:#262c2e;
  --sidebar-bg:#171a1b;--topbar-bg:rgba(18,21,22,.94);--tag-bg:#262c2e;--tag-ink:#c5cbcd;--th-bg:#22282a;--input-bg:#121516;--input-border:#3a4245;--photo:#e9eded;
  --ok-bg:#16342b;--ok-ink:#8fe0b9;--off-bg:#3a1d16;--off-ink:#ffb4a6;--warn-bg:#3a2e14;--warn-ink:#f2c46b;--stock-low:#f2b25c;--stock-out:#ff8f85;--err-bg:#3a1d16;--err-ink:#ffa58c;
  --demo-bg:#2a2416;--demo-line:#4a3d1f;--demo-ink:#f0d9a0;--toast-bg:#2a3133;--tip-bg:#2a3133;--tip-sub:#c5cbcd;--shade:#000000a6;--focus:#ff8a4c;
  --series-1:#3987e5;--ord-1:#184f95;--ord-2:#256abf;--ord-3:#3987e5;--ord-4:#6da7ec;
  --viz-text:#f0efec;--viz-text-2:#c3c2b7;--viz-axis:#383835;--good:#0ca30c;--bad:#ff7b72;--goal-track:#2c3234}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.03em;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
p{margin:0}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--surface);padding:8px 12px;border-radius:8px;z-index:70}
.skip-link:focus{left:8px}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.icon{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main:focus,#product-title:focus,#nomatch-title:focus{outline:none}

/* Menú lateral, barra superior y página, como en la guía */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:var(--sidebar-bg);border-right:1px solid var(--line);padding:35px 22px 24px;display:flex;flex-direction:column;z-index:30;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 12px;color:var(--ink);text-decoration:none}
.brand-mark{font:900 34px/1 var(--display);letter-spacing:-3px;color:var(--ink);position:relative}
.brand-mark:after{content:'';position:absolute;right:-5px;top:0;width:5px;height:29px;background:var(--orange);transform:skew(-14deg)}
.brand-label{border-left:1px solid var(--line-2);margin-left:8px;padding-left:12px;font-size:9px;line-height:1.5;letter-spacing:1.6px;font-weight:700;color:var(--ink)}
.nav-caption{color:var(--muted);font-size:10px;font-weight:650;letter-spacing:1.4px;text-transform:uppercase;margin:44px 14px 13px}
.nav-list{display:flex;flex-direction:column;gap:6px}
.nav-button{display:flex;align-items:center;gap:13px;border:0;background:transparent;padding:12px 14px;border-radius:10px;color:var(--muted);text-align:left;width:100%;font-weight:550;font-size:13px;cursor:pointer;transition:background .18s,color .18s}
.nav-button:hover{background:var(--hover);color:var(--ink)}
.nav-button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text);font-weight:650}
.nav-button .icon{width:19px;height:19px}
.nav-button .count{margin-left:auto}
.sidebar-bottom{margin-top:auto;padding-top:24px;display:grid;gap:18px}
.sidebar-user{padding:16px 15px;background:var(--surface-2);border-radius:12px;border:1px solid var(--line)}
.sidebar-user>.icon{color:var(--orange);width:24px;height:24px;margin-bottom:10px}
.sidebar-name{display:block;font:750 13.5px/1.3 var(--display);letter-spacing:-.02em;margin-bottom:3px}
.mobile-brand .brand{padding:0}
.sidebar-user p{font-size:12px;color:var(--muted);line-height:1.5}
.sidebar-user button{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;border-top:1px solid var(--line);margin-top:12px;padding:10px 0 0;font-size:12px;font-weight:650;color:var(--ink);cursor:pointer}
.sidebar-user button .icon{width:15px;height:15px}
.sidebar-footer{padding:0 8px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.theme-switch{padding:0 8px}
.theme-label{display:block;color:var(--muted);font-size:10px;font-weight:650;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:8px}
.theme-options{display:flex;gap:3px;padding:3px;border-radius:10px;background:var(--tag-bg)}
.theme-options button{flex:auto;border:0;border-radius:8px;background:none;padding:10px 4px;font-size:11.5px;font-weight:600;white-space:nowrap;color:var(--ink-2);cursor:pointer}
.theme-options button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px #19232624}
.shell{margin-left:var(--sidebar);min-height:100vh}
.shell.no-sidebar{margin-left:0}
.topbar{position:sticky;top:0;z-index:25;min-height:76px;background:var(--topbar-bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px 16px;padding:10px 40px;flex-wrap:wrap}
.breadcrumb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px}
.breadcrumb strong{font-weight:500;color:var(--ink-2)}
.breadcrumb .icon{width:14px;height:14px}
.topbar-right{display:flex;align-items:center;gap:12px;margin-left:auto;flex-wrap:wrap}
.topbar .theme-switch{display:flex;align-items:center;gap:10px;padding:0}
.topbar .theme-label{margin:0}
.mode-badge{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent-text);border-radius:999px;padding:7px 13px;font-weight:600;font-size:12.5px}
.mobile-brand,.mobile-menu,.menu-shade{display:none}
.page{padding:30px 40px 40px;max-width:1260px;margin:0 auto}
.demo{background:var(--demo-bg);border-bottom:1px solid var(--demo-line);color:var(--demo-ink);font-size:12.5px}
.demo-in{max-width:1260px;margin:0 auto;padding:9px 40px;display:flex;gap:8px;align-items:flex-start}
.count{background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:11px;font-weight:650;padding:1px 7px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:9px;border:1px solid transparent;padding:11px 17px;font-weight:650;font-size:13px;cursor:pointer;text-decoration:none;line-height:1.2;text-align:center;transition:background .2s,transform .2s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-dark{background:var(--ink);color:var(--surface)}
.btn-secondary{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-secondary:hover{border-color:var(--line-2)}
.btn-ghost{background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--hover)}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:8px}
.btn-full{width:100%}
.link-btn{background:none;border:0;color:var(--ink-2);font-weight:600;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px;flex:none}
.icon-btn{background:none;border:1px solid transparent;border-radius:8px;padding:6px;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{background:var(--off-bg);color:var(--off-ink)}

/* Estructura */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:21px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.section-title h2{font-size:27px;font-weight:750;letter-spacing:-1px;line-height:1.3;margin-top:8px}
.section-title p{margin-top:4px}
.hint{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{text-transform:uppercase;letter-spacing:1.7px;font-size:10.5px;font-weight:650;color:var(--accent-text);display:flex;gap:8px;align-items:center}
.eyebrow:before{content:'';width:17px;height:2px;background:currentColor;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--line-2)}
.chip[aria-pressed="true"]{border-color:var(--orange);background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.tag{display:inline-block;background:var(--tag-bg);border-radius:6px;padding:2px 9px;font-size:12px;color:var(--tag-ink)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.badge-ok{background:var(--ok-bg);color:var(--ok-ink)}
.badge-off{background:var(--off-bg);color:var(--off-ink)}
.field{display:grid;gap:6px}
.field label,.field legend{font-weight:600;font-size:13px}
.input{width:100%;border:1px solid var(--input-border);border-radius:9px;padding:10px 12px;background:var(--input-bg);color:var(--ink)}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.input::placeholder{color:var(--muted)}
.form-error{background:var(--err-bg);color:var(--err-ink);border-radius:9px;padding:10px 12px;font-size:13px}
.warn{display:inline-flex;gap:6px;align-items:center;color:var(--stock-low);font-size:12px;margin-top:4px}
.warn .icon{width:15px;height:15px}
.empty{display:flex;gap:14px;align-items:flex-start}
.empty-state{text-align:center;display:grid;justify-items:center;gap:10px;padding:40px 20px}
.empty-state .icon{width:34px;height:34px;color:var(--orange)}
.points{margin:8px 0 0;padding-left:18px;display:grid;gap:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* Tablas */
.table-wrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;font-weight:600;color:var(--ink-2);background:var(--th-bg);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.table tr:last-child td{border-bottom:0}
.num,.table th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-actions{display:flex;gap:4px;flex-wrap:wrap}
.detail td{background:var(--surface-2)}
.detail-box{display:grid;gap:10px}
.table.inner{border:1px solid var(--line);border-radius:8px}

/* Acceso */
.login-intro{max-width:720px;margin:6px 0 22px}
.login-intro h1{font-size:29px;font-weight:750;letter-spacing:-1.1px;line-height:1.3;margin:8px 0 8px}
.login-intro p{color:var(--muted);font-size:14px}
.login-grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:16px;align-items:start}
.login-card{display:grid;gap:14px}
.login-card h2{font-size:19px}
.role-pick{border:0;padding:0;margin:0;display:grid;gap:8px}
.role-pick legend{margin-bottom:8px}
.role{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:13px;cursor:pointer;background:var(--surface)}
.role input{margin-top:3px;accent-color:var(--orange)}
.role.on{border-color:var(--orange);background:var(--accent-soft)}
.role strong{display:flex;align-items:center;gap:6px}
.role small{display:block;color:var(--muted);font-size:12.5px}
.role.on small{color:var(--ink-2)}
.compare-table td:first-child{font-weight:600}

/* Atender cliente y productos */
.lookup-form{display:flex;gap:8px;margin:12px 0}
.lookup-form .input{max-width:360px}
.product-head{display:grid;grid-template-columns:160px minmax(0,1fr);gap:20px}
.product-img,.cat-img{background:var(--photo);border-radius:12px;display:grid;place-items:center;aspect-ratio:1/1;overflow:hidden}
.product-img img,.cat-img img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;padding:10px}
.brand-line{color:var(--accent-text);font-weight:800;font-family:var(--display);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.product h2{font-size:23px;letter-spacing:-.8px;margin:4px 0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px;margin:14px 0 0}
.facts div{min-width:0}
.facts dt{color:var(--muted);font-size:12px}
.facts dd{margin:2px 0 0;font-weight:600}
.facts.compact{grid-template-columns:1fr 1fr;gap:8px 12px;margin:10px 0}
.product-body{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.product-body h3,.alts h3{font-size:15px}
.profiles{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.profiles li{display:grid;gap:6px}
.alts{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.alt-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:10px}
.alt{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:2px}
.alt:hover{border-color:var(--line-2)}
.alt span{color:var(--muted);font-size:12.5px}
.filters{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1 1 260px;max-width:380px}
.search .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:38px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cat-card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:grid;grid-template-rows:auto 1fr;background:var(--surface)}
.cat-img{border-radius:0;aspect-ratio:16/10}
.cat-body{padding:14px;display:grid;gap:4px;align-content:start}
.cat-body h3{font-size:15px}
.talk summary{cursor:pointer;font-weight:600;font-size:13px;margin:4px 0 8px}

/* Pedido */
.order-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty-btn{border:0;background:var(--surface-2);color:var(--ink);width:32px;height:34px;cursor:pointer;font-size:16px}
.qty-input{width:52px;height:34px;border:0;text-align:center;background:var(--input-bg);color:var(--ink);-moz-appearance:textfield}
.qty-input::-webkit-outer-spin-button,.qty-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.order-summary h3{font-size:16px;margin-bottom:10px}
.sum{margin:0 0 16px;display:grid;gap:8px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum dt{color:var(--ink-2)}
.sum dd{margin:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.sum-total{border-top:1px solid var(--line);padding-top:10px;font-weight:700}

/* Métricas */
.metric-filters{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.metric-filters .label{font-weight:600;font-size:13px;margin-right:4px}
.kpis{display:grid;grid-template-columns:minmax(230px,1.5fr) repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.kpi .k-label{color:var(--viz-text-2);font-size:12.5px}
.kpi .k-value{font:700 28px/1.15 var(--body);color:var(--viz-text);margin-top:6px}
.kpi .k-sub{color:var(--viz-text-2);font-size:12.5px;margin-top:2px}
.kpi.hero .k-value{font-size:52px;line-height:1.05}
.delta{font-size:12.5px;margin-top:6px;color:var(--viz-text-2)}
.delta.good{color:var(--good)}
.delta.bad{color:var(--bad)}
/* Metas: barra de avance con el estado escrito al lado (el color no es la única señal) */
.goals{display:grid;gap:14px}
.goal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.goal-label strong{display:block;font-size:13.5px}
.goal-label small{display:block;color:var(--muted);font-size:12.5px}
.goal-track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--goal-track);overflow:hidden}
.goal-fill{display:block;height:100%;width:calc(var(--p) * 100%);background:var(--series-1);border-radius:99px}
.badge-pending{background:var(--tag-bg);color:var(--tag-ink)}
.goal .badge .icon{width:14px;height:14px}
.viz-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.viz-card{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;min-width:0}
.viz-card.wide{grid-column:1/-1}
.viz-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.viz-head h3{font-size:15.5px}
.viz-head p{margin-top:2px;color:var(--viz-text-2);font-size:12.5px}
.bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(120px,34%) minmax(0,1fr);gap:12px;align-items:center}
.bar-label{color:var(--viz-text);font-size:13px;line-height:1.3;min-width:0}
.bar-label small{display:block;color:var(--viz-text-2);font-size:12px}
.bar-area{display:flex;align-items:center;min-height:30px;border-left:1px solid var(--viz-axis);border-radius:2px;cursor:default}
.bar{flex:none;height:18px;width:calc((100% - 84px) * var(--w));border-radius:0 4px 4px 0}
.bar-value{margin-left:8px;color:var(--viz-text);font-weight:600;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar-area:hover .bar,.bar-area:focus-visible .bar{filter:brightness(1.12)}
.data-table{margin-top:14px}
figcaption{margin-top:12px;color:var(--viz-text-2);font-size:12px}
.viz-tip{position:fixed;z-index:60;background:var(--tip-bg);color:#fff;border-radius:8px;padding:7px 10px;font-size:12.5px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.2);max-width:260px}
.viz-tip strong{display:block;font-size:14px}
.viz-tip span{color:var(--tip-sub)}
.att-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px;font-size:13px}
.att-list li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:6px}

.foot{margin-top:28px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:var(--toast-bg);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;transition:.2s;pointer-events:none;z-index:80;max-width:calc(100% - 32px);box-shadow:0 10px 40px #18293125}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Resultado de la atención y reposición */
.inline-panel{margin-top:14px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:14px;display:grid;gap:10px}
.low-stock{display:flex;align-items:center;gap:6px;color:var(--stock-low);font-size:12.5px;font-weight:600}
.low-stock .icon{width:16px;height:16px}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--tag-bg);color:var(--tag-ink)}
.status.pending{background:var(--warn-bg);color:var(--warn-ink)}
.status.done{background:var(--ok-bg);color:var(--ok-ink)}
.status.off{background:var(--off-bg);color:var(--off-ink)}

/* QR para anaquel: el código siempre en negro sobre blanco para que se pueda escanear */
.qr-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.qr-box{display:grid;justify-items:center;gap:12px;text-align:center}
.qr-box>svg{width:100%;max-width:260px;height:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.qr-link{word-break:break-all;font-size:12.5px;background:var(--surface-2);border-radius:8px;padding:8px 10px;width:100%;text-align:left}
#print-sheet{display:none}
@media print{
  body>*:not(#print-sheet){display:none!important}
  #print-sheet{display:block;text-align:center;color:#000;background:#fff;padding:24px;font-family:"DM Sans",system-ui,sans-serif}
  #print-sheet svg{width:70mm;height:70mm}
  #print-sheet h1{font-size:22pt;margin:10px 0}
}

/* Tiempo hasta la recomendación */
.time-stat{display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap;margin-bottom:12px}
.time-stat .k-value{font:700 32px/1 var(--body);color:var(--viz-text)}
.time-stat .k-sub{color:var(--viz-text-2);font-size:12.5px}
.time-stat .delta{margin-top:0}

/* Atender sin celular: las preguntas de la guía */
.mode-switch{margin-top:10px}
.mode-switch .chip{padding:7px 14px;font-size:13px}
.questions{display:grid;gap:16px;margin-top:16px}
.q-group{border:0;margin:0;padding:0;min-width:0}
.q-group legend{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:0;margin-bottom:8px}
.q-n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:11.5px;flex:none}
.opt{position:relative;display:inline-flex}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.opt span{display:inline-flex;align-items:center;border:1px solid var(--input-border);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.opt span:hover{border-color:var(--line-2)}
.opt input:checked+span{border-color:var(--orange);background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.opt input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.assist-head{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.why-text{margin-top:8px;color:var(--ink-2)}

/* Servicio y garantía */
.contact-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.center-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:12px}
.center{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;align-content:start;background:var(--surface)}
.center h3{font-size:15px;display:flex;align-items:center;gap:6px}
.center h3 .icon{color:var(--orange)}
.center .actions{margin-top:4px}
.warranty-points{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:12px}
.warranty-points div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.warranty-points h3{font-size:14px;margin-bottom:4px}
.faq{margin-top:12px}
.faq details{border-top:1px solid var(--line);padding:10px 0}
.faq summary{cursor:pointer;font-weight:600}
.faq p{margin-top:6px;color:var(--ink-2)}
.service-link{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.service-link .icon{width:16px;height:16px;color:var(--orange)}

/* Lo que se está acabando */
.low-list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.low-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.low-row{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.low-side{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stock-tag{font-weight:600;font-size:12.5px;color:var(--stock-low);white-space:nowrap}
.stock-tag.out{color:var(--stock-out)}

/* Datos de este navegador */
.demo-link{color:var(--demo-ink);font-size:12.5px;padding:0 0 0 4px}
.data-panel{margin-bottom:16px;border-color:var(--input-border)}
.data-panel h2{font-size:18px;margin-top:2px}
.data-counts{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.data-result{margin-top:12px;font-size:13px;border-radius:10px;padding:10px 12px;background:var(--ok-bg);color:var(--ok-ink)}
.data-result.error{background:var(--err-bg);color:var(--err-ink)}

@media (max-width:1100px){

}

  .login-grid,.order-layout,.viz-grid,.grid-2,.qr-layout{grid-template-columns:minmax(0,1fr)}

  .kpi.hero{grid-column:1/-1}
}

  .mobile-brand .brand-label{font-size:8px}
  .mobile-menu{display:grid;place-items:center;background:none;border:0;padding:6px;margin-right:2px;color:var(--ink);cursor:pointer}
  .mobile-menu .icon{width:22px;height:22px}
  .page{padding:24px 18px 32px}
  .demo-in{padding:8px 18px}
}
@media (max-width:560px){
  .page{padding:20px 16px 28px}

  .section-title h2{font-size:23px}
  .login-intro h1{font-size:24px}

  .product-img{max-width:180px}
  .lookup-form{flex-wrap:wrap}
  .lookup-form .input{max-width:none;flex:1 1 200px}
  .bar-row{grid-template-columns:minmax(0,1fr);gap:4px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi.hero{grid-column:1/-1}
  .kpi .k-value{font-size:24px}
  .kpi.hero .k-value{font-size:48px}
  .card,.viz-card{padding:16px}
  .facts.compact{grid-template-columns:minmax(0,1fr)}
  /* Tablas de reposición y pedido sugerido: cada fila como tarjeta para no esconder las acciones */
  .table.stacked thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
  .table.stacked tr{display:block;padding:8px 0;border-bottom:1px solid var(--line)}
  .table.stacked tr:last-child{border-bottom:0}
  .table.stacked td{display:block;border:0;padding:3px 14px;text-align:right;white-space:normal}
  .table.stacked td::before{content:attr(data-label);float:left;margin-right:12px;color:var(--ink-2);font-weight:600}
  .table.stacked td:first-child{text-align:left;padding-bottom:6px}
  .table.stacked td:first-child::before{content:none}
  .table.stacked td:empty{display:none}
  .table.stacked .row-actions{justify-content:flex-end}
}
@media (pointer:coarse){.input,.qty-input{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

    vacuum:[['home',/\b(casa|hogar|apartamento|cuartos?|habitacion|sala|espacios pequenos)\b/],['car',/\b(carro|asientos?|cabina|tapiceria|baul|camioneta)\b/],['workshop',/\b(taller|negocio|bodega|local|comercio|tienda|superficies amplias)\b/],['liquids',/\b(liquidos?|derrame\w*|agua)\b/]],
    faucet:[['bathroom',/\b(lavamanos|lavabo)\b/],['kitchen',/\b(cocina|lavatrastos|lavaplatos|fregadero)\b/],['shower',/\b(ducha|regadera)\b/]]
  };

  const priorityRules = [['economy',/\b(economico|economica|barato|barata|baratito|baratita|presupuesto|ahorrar|bajo costo|menos caro|precio bajo)\b/],['power',/\b(mayor capacidad|mas capacidad|potente|potencia|mas fuerte|trabajo exigente|maxima capacidad)\b/],['balance',/\b(equilibrio|equilibrad\w*|balance|combinacion|calidad precio|precio calidad|intermedio)\b/]];

      : [['catalogo','Catálogo mayorista','box'],['pedido','Nuevo pedido','cart'],['pedidos','Mis pedidos','file'],['reposicion','Reposición','refresh'],['qr','QR para anaquel','qr'],['servicio','Servicio y garantía','shield'],['metricas','Métricas','chart']];
    const inOrder = state.draft.lines.reduce((n,l)=>n+l.boxes,0);

    return `<div class="menu-shade${state.menuOpen?' open':''}" data-action="toggle-menu"></div>
    <aside class="sidebar${state.menuOpen?' open':''}" aria-label="Menú del portal">${brand()}<p class="nav-caption">Modo ${collab?'colaborador':'mayorista'}</p><nav class="nav-list" aria-label="Secciones">${nav}</nav><div class="sidebar-bottom">${user}${themeSwitch()}<div class="sidebar-footer"><span>Prototipo</span><span>Datos de ejemplo</span></div></div></aside>

  }
  const footer = () => `<p class="foot">Prototipo para revisión del equipo de HPC Smart Guide. Productos, códigos y reglas de recomendación vienen de la guía de clientes (versión ${GUIDE_VERSION}). Los precios mayoristas, existencias, pedidos y métricas son datos de ejemplo y se guardan solo en este navegador.</p>`;

  function view(){
    switch(state.tab){
      case 'atender': return attendView();
      case 'productos': return productsView();
      case 'catalogo': return catalogView();
      case 'pedido': return orderView();
      case 'pedidos': return ordersView();
      case 'metricas': return metricsView();
      case 'analisis': return analysisView();
      case 'reposicion': return restockView();
      case 'qr': return qrView();
      case 'servicio': return serviceView();
      default: return '';
    }
  }

  // Modo colaborador: atender cliente
  // Código de atención de la guía (attentionCode() en dist/app.js): letra de la necesidad; número del material,
  // de la frecuencia y de la prioridad; y una letra de control que detecta un carácter mal escrito o dos números intercambiados.
  const CHECK_LETTERS = 'ACDEFHJKLMNPRTUVWXY';
  function encodeAttention(a){const proj=PROJECTS.find(x=>x.id===a.project);if(!proj)return null;const m=proj.materials.findIndex(x=>x[0]===a.material),f=FREQUENCY.findIndex(x=>x[0]===a.frequency),r=PRIORITY.findIndex(x=>x[0]===a.priority);if(m<0||f<0||r<0)return null;return proj.letter+(m+1)+(f+1)+(r+1)+CHECK_LETTERS[(proj.letter.charCodeAt(0)-64+2*m+3*f+5*r)%CHECK_LETTERS.length];}
  const attentionKey = q => String(q).toUpperCase().replace(/[\s-]+/g,'');
  const looksLikeAttention = q => /^[A-Z]\d{3}[A-Z]$/.test(attentionKey(q));
  // Las cuatro respuestas del cliente, o null si el código no es válido.
  function decodeAttention(q){
    const k=attentionKey(q), m=/^([A-Z])(\d)(\d)(\d)[A-Z]$/.exec(k), proj=m&&PROJECTS.find(x=>x.letter===m[1]);
    if(!proj)return null;
    const mat=proj.materials[m[2]-1], fr=FREQUENCY[m[3]-1], pr=PRIORITY[m[4]-1];
    if(!mat||!fr||!pr)return null;
    const a={project:proj.id,material:mat[0],frequency:fr[0],priority:pr[0]};
    return encodeAttention(a)===k?a:null;
  }
  // Lleva el foco al título del resultado y muestra el resultado completo debajo de la barra fija (en celular mide unos 145 px);
  // si no hay resultado, el foco vuelve al campo de búsqueda.
  function focusLookupResult(){const h=document.getElementById('product-title')||document.getElementById('nomatch-title');if(!h){document.getElementById('lookup')?.focus();return;}h.setAttribute('tabindex','-1');h.focus({preventScroll:true});const top=(h.closest('article')||h).getBoundingClientRect().top+window.scrollY-(document.querySelector('.topbar')?.offsetHeight||0)-12;window.scrollTo(0,Math.max(0,top));}
  const findProduct = q => {const k=q.trim().toLowerCase().replace(/\s+/g,'');return PRODUCTS.find(p=>p.code===k||p.model.toLowerCase()===k);};
  function attendView(){
    const switcher = `<div class="chips mode-switch" role="group" aria-label="Cómo llega el cliente">${[['codigo','Trae el código de la guía'],['preguntas','No tiene celular: hacer las preguntas']].map(([id,label])=>`<button class="chip" data-action="attend-mode" data-mode="${id}" aria-pressed="${state.attendMode===id}">${label}</button>`).join('')}</div>`;
    if(state.attendMode==='preguntas')return `<section class="stack">
      <div class="card"><div class="eyebrow">Atender cliente</div>${switcher}<h2 style="font-size:21px;margin-top:12px">Hazle al cliente las preguntas de la guía</h2>
        <p class="hint" style="margin-top:4px">Son las mismas cuatro preguntas y la misma regla de la guía de clientes, para quien no tiene celular o no escaneó el QR.</p>
        ${questionsForm()}
      </div>
      ${assistResult()}
    </section>`;
    const q = state.lookup.trim(), coded = q ? decodeAttention(q) : null, p = q && !coded ? findProduct(q) : null;
    const missing = looksLikeAttention(q)
      ? `<h3 style="font-size:16px">El código de atención «${esc(attentionKey(q))}» no es válido.</h3><p class="hint" style="margin-top:4px">Revisa que esté bien escrito: la última letra comprueba los demás caracteres. Si no coincide, pide al cliente que te muestre otra vez su pantalla o hazle las preguntas de la guía.</p>`
      : `<h3 style="font-size:16px">No encontramos «${esc(q)}» en la muestra.</h3><p class="hint" style="margin-top:4px">Revisa el código. La muestra del prototipo tiene ${PRODUCTS.length} productos; si el cliente busca otro, oriéntalo con un asesor de HPC.</p>`;
    return `<section class="stack">
      <div class="card"><div class="eyebrow">Atender cliente</div>${switcher}<h2 style="font-size:21px;margin-top:12px">¿Qué le recomendó la guía al cliente?</h2>
        <p class="hint" style="margin-top:4px">Escribe el código de atención que te muestra el cliente para ver sus respuestas y por qué la guía le recomendó esa herramienta. También sirve el código de producto o el modelo.</p>
        <form id="lookup-form" class="lookup-form" role="search"><label class="sr-only" for="lookup">Código de atención, código de producto o modelo</label><input id="lookup" class="input" autocomplete="off" placeholder="Por ejemplo: P412L, 103246 o ROTI-20A3" value="${esc(q)}"${q&&!coded&&!p?' aria-invalid="true" aria-describedby="lookup-error"':''}><button class="btn btn-dark" type="submit">${icon('search')} Buscar</button></form>
        <div class="chips" role="group" aria-label="Códigos para probar"><span class="hint small" style="align-self:center">Prueba con un código de atención:</span>${['P412L','G211M'].map(c=>`<button class="chip" data-action="try-code" data-code="${c}">${c}</button>`).join('')}<span class="hint small" style="align-self:center">o de producto:</span>${['103246','19320','101595','12093','49590'].map(c=>`<button class="chip" data-action="try-code" data-code="${c}">${c}</button>`).join('')}</div>
      </div>
      ${q ? (coded ? assistResult(coded, attentionKey(q)) : p ? productPanel(p) : `<div class="card empty" id="lookup-error">${icon('info')}<div>${missing}</div></div>`) : ''}
    </section>`;
  }
  // Atender sin celular: las cuatro preguntas de la guía y la misma regla (chooseProduct).
  function questionsForm(){
    const a = state.answers, proj = PROJECTS.find(x=>x.id===a.project);
    const group = (n, key, title, opts, empty) => `<fieldset class="q-group"><legend><span class="q-n" aria-hidden="true">${n}</span>${esc(title)}</legend>${opts
      ? `<div class="chips">${opts.map(([id,label])=>`<label class="opt"><input type="radio" name="q-${key}" value="${id}"${a[key]===id?' checked':''}><span>${esc(label)}</span></label>`).join('')}</div>`
      : `<p class="hint small">${esc(empty)}</p>`}</fieldset>`;
    return `<form id="questions-form" class="questions" novalidate>
      ${group(1,'project',QUESTIONS.project,PROJECTS.map(x=>[x.id,x.name]))}
      ${group(2,'material',proj?proj.materialQuestion:'Material o lugar',proj?proj.materials:null,'Esta pregunta depende de lo que necesite hacer.')}
      ${group(3,'frequency',QUESTIONS.frequency,FREQUENCY)}
      ${group(4,'priority',QUESTIONS.priority,PRIORITY)}
      ${Object.keys(a).length?`<div><button class="btn btn-ghost btn-sm" type="button" data-action="answers-reset">${icon('refresh')} Empezar con otro cliente</button></div>`:''}
    </form>`;
  }
  const answersComplete = a => !!(a.project && a.material && a.frequency && a.priority);
  // Con code, el cliente trae el código de atención de la guía: las respuestas vienen del código.
  function assistResult(a = state.answers, code = ''){
    if(!answersComplete(a))return '';
    const proj = PROJECTS.find(x=>x.id===a.project), p = chooseProduct(a);
    const chosen = [proj.name, proj.materials.find(m=>m[0]===a.material)[1], FREQUENCY.find(f=>f[0]===a.frequency)[1], PRIORITY.find(x=>x[0]===a.priority)[1]];
    const head = `<div class="assist-head"><div class="eyebrow">${code?`Código de atención ${esc(code)} · `:''}${p?(code?'La guía le recomendó':'La guía le recomendaría'):'Resultado de la guía'}</div><div class="chips" style="margin-top:8px" role="group" aria-label="Respuestas del cliente">${chosen.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div>${code&&p&&candidatesFor(p,a).length?'<p class="hint small" style="margin-top:8px">Si el cliente te muestra otro producto, lo eligió entre las otras opciones adecuadas que aparecen al final.</p>':''}</div>`;
    if(p)return productPanel(p, {head, reason:reasonFor(p,a), alts:candidatesFor(p,a)});
    return `<article class="card" aria-labelledby="nomatch-title">${head}<div class="empty">${icon('headset')}<div><h2 id="nomatch-title" style="font-size:18px">La muestra no tiene una opción para esta necesidad.</h2>
      <p class="hint" style="margin-top:4px">La muestra de grifería incluye un modelo para lavamanos de baño. Para cocina, ducha u otra instalación, deriva al cliente con un asesor de HPC para confirmar la opción adecuada; no la sustituyas por otro producto de la muestra.</p>
      <div class="actions"><a class="btn btn-secondary" href="tel:${SUPPORT.tel}">${icon('phone')} Asesoría de HPC: ${SUPPORT.phone}</a></div>
      <div class="inline-panel" role="group" aria-labelledby="nomatch-outcome"><strong id="nomatch-outcome">¿Cómo terminó la atención?</strong><div class="chips"><button class="chip" data-action="attend-save" data-id="" data-outcome="asesor">Lo derivé a un asesor de HPC</button><button class="chip" data-action="attend-save" data-id="" data-outcome="consulta">Solo estaba consultando</button></div></div>
    </div></div></article>`;
  }
  function profiles(p){
    const proj = PROJECTS.find(x=>x.id===p.category);
    const rows = proj.materials.map(([mid,mlabel])=>{
      const hits=[];
      FREQUENCY.forEach(([fid,fl])=>PRIORITY.forEach(([pid,pl])=>{const c=chooseProduct({project:p.category,material:mid,frequency:fid,priority:pid});if(c&&c.id===p.id)hits.push(`${fl} · ${pl}`);}));
      return {mlabel,hits};
    }).filter(r=>r.hits.length);
    if(!rows.length)return `<p class="hint" style="margin-top:8px">La guía no lo elige automáticamente; aparece como alternativa en la comparación.</p>`;
    return `<ul class="profiles">${rows.map(r=>`<li><strong>«${esc(r.mlabel)}»</strong>${r.hits.length===9?'<span class="hint small">Con cualquier frecuencia y prioridad.</span>':`<div class="chips">${r.hits.map(h=>`<span class="tag">${esc(h)}</span>`).join('')}</div>`}</li>`).join('')}</ul>`;
  }
  // opts (al atender sin celular): head con las respuestas, reason de la guía y alts = alternativas adecuadas según las respuestas.
  function productPanel(p, opts={}){
    const st = state.session.store, proj = PROJECTS.find(x=>x.id===p.category);

          <div class="chips" style="margin-top:10px">${p.features.map(f=>`<span class="tag">${esc(f)}</span>`).join('')}</div>
          <dl class="facts"><div><dt>Modelo</dt><dd>${esc(p.model)}</dd></div><div><dt>Código</dt><dd>${esc(p.code)}</dd></div><div><dt>Precio al público (ejemplo)</dt><dd>${money(p.price)}</dd></div><div><dt>Área orientativa</dt><dd>${esc(p.area)}</dd></div><div><dt>En ${esc(storeName(st))} (ejemplo)</dt><dd>${stockText(STORE_STOCK[st][p.id])}</dd></div><div><dt>Bodega de HPC (ejemplo)</dt><dd>${stockText(WAREHOUSE[p.id])}</dd></div></dl>
          ${STORE_STOCK[st][p.id]<=LOW_STOCK?`<p class="low-stock" style="margin-top:12px">${icon('info')} ${STORE_STOCK[st][p.id]?'Quedan pocas unidades':'Está agotado'} en ${esc(storeName(st))}: puedes pedir reposición.</p>`:''}
          <div class="actions"><button class="btn btn-primary" data-action="attend-open" data-id="${p.id}" aria-expanded="${state.attendFor===p.id}">${icon('check')} Registrar atención</button><button class="btn btn-secondary" data-action="restock-open" data-id="${p.id}" aria-expanded="${state.restockFor===p.id}">${icon('refresh')} Pedir reposición</button><button class="btn btn-secondary" data-action="copy" data-text="${esc(`${p.name} · modelo ${p.model} · código ${p.code}`)}">${icon('copy')} Copiar modelo y código</button><a class="btn btn-ghost" href="${p.source}" target="_blank" rel="noopener noreferrer">Ficha oficial ${icon('external')}</a></div>
          ${state.attendFor===p.id?outcomePanel(p,alts):''}${state.restockFor===p.id?restockPanel(p):''}
          <p class="service-link">${icon('shield')} ¿Pregunta por garantía o servicio? <button class="link-btn" data-action="tab" data-tab="servicio">Ver servicio y garantía</button></p>
        </div>
      </div>
      <div class="grid-2 product-body">${opts.reason?`<section><h3>Lo que la guía le explica al cliente</h3><p class="why-text">${esc(opts.reason)}</p></section>`:`<section><h3>La guía lo recomienda cuando el cliente elige</h3>${profiles(p)}</section>`}<section><h3>Cómo explicarlo</h3><ul class="points">${TALK[p.id].map(t=>`<li>${esc(t)}</li>`).join('')}</ul></section></div>
      ${shown.length?`<section class="alts"><h3>${opts.alts?'Otras opciones adecuadas de la muestra':'Otras opciones de la muestra'}</h3><div class="alt-list">${shown.map(a=>`<button class="alt" data-action="try-code" data-code="${a.code}"><strong>${esc(a.name)}</strong><span>${esc(a.model)} · ${money(a.price)} · ${stockText(STORE_STOCK[st][a.id])} en tienda</span></button>`).join('')}</div></section>`
        :opts.alts?`<section class="alts"><h3>Otras opciones de la muestra</h3><p class="hint" style="margin-top:6px">La muestra no incluye otra herramienta adecuada para esta necesidad. Si el cliente duda, consulta con un asesor de HPC.</p></section>`:''}
    </article>`;
  }

  // Búsqueda y filtros compartidos (productos del colaborador y catálogo mayorista)
  const filtered = () => {const q=state.search.trim().toLowerCase();return PRODUCTS.filter(p=>(state.category==='all'||p.category===state.category)&&(!q||`${p.name} ${p.model} ${p.code} ${p.brand}`.toLowerCase().includes(q)));};
  const filters = () => `<div class="filters"><label class="search"><span class="sr-only">Buscar productos</span>${icon('search')}<input id="search" class="input" placeholder="Buscar por nombre, modelo o código" value="${esc(state.search)}" autocomplete="off"></label><div class="chips" role="group" aria-label="Necesidad">${[['all','Todas'],...PROJECTS.map(p=>[p.id,p.name])].map(([id,label])=>`<button class="chip" data-action="category" data-category="${id}" aria-pressed="${state.category===id}">${esc(label)}</button>`).join('')}</div></div>`;
  const results = () => state.session.mode==='colaborador' ? productsTable(filtered()) : catalogCards(filtered());

  function productsView(){
    return `<section class="card"><div class="section-title"><div><div class="eyebrow">Productos</div><h2>Muestra del catálogo</h2><p class="hint">Existencias de ${esc(storeName(state.session.store))} y precios al público de ejemplo.</p></div></div>${filters()}<div id="results">${results()}</div></section>`;
  }
  function productsTable(list){

  }

  // Modo mayorista: catálogo, pedido y pedidos
  function catalogView(){
    const lines = state.draft.lines.length;
    return `<section class="card"><div class="section-title"><div><div class="eyebrow">Catálogo mayorista</div><h2>Precios por volumen</h2><p class="hint">Precio mayorista de ejemplo: ${pct(WHOLESALE_RATE)} del precio público de ejemplo. Descuento por producto: ${TIERS.filter(t=>t.disc).reverse().map(t=>`${t.label}, ${pct(t.disc)}`).join(' · ')}.</p></div><button class="btn btn-dark" data-action="tab" data-tab="pedido">${icon('cart')} Ver pedido${lines?` (${lines} ${lines===1?'producto':'productos'})`:''}</button></div>${filters()}<div id="results">${results()}</div></section>`;

  function catalogCards(list){

      const w=wholesale(p), box=BOX[p.id], line=state.draft.lines.find(l=>l.id===p.id);
      return `<article class="cat-card"><div class="cat-img">${img(p)}</div><div class="cat-body"><span class="brand-line">${esc(p.brand)}</span><h3>${esc(p.name)}</h3><p class="hint small">${esc(p.model)} · código ${esc(p.code)}</p>
        <dl class="facts compact"><div><dt>Precio mayorista (ejemplo)</dt><dd>${money(w)} c/u</dd></div><div><dt>Caja</dt><dd>${box} ${box===1?'unidad':'unidades'} · ${money(w*box)}</dd></div><div><dt>Precio público sugerido</dt><dd>${money(p.price)}</dd></div><div><dt>Margen estimado</dt><dd>${pct((p.price-w)/p.price)}</dd></div><div><dt>Bodega de HPC (ejemplo)</dt><dd>${stockText(WAREHOUSE[p.id])}</dd></div></dl>
        <details class="talk"><summary>Argumentos de venta</summary><ul class="points">${TALK[p.id].map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details>

    }).join('')}</div>`;
  }
  function totals(lines){
    const rows=lines.map(l=>{const p=productById(l.id),box=BOX[l.id],u=l.boxes*box,unit=wholesale(p),disc=tierFor(l.boxes).disc,gross=u*unit,total=Math.round(gross*(1-disc)*100)/100;return {p,box,boxes:l.boxes,units:u,unit,disc,gross,total};});
    const gross=rows.reduce((s,r)=>s+r.gross,0), net=Math.round(rows.reduce((s,r)=>s+r.total,0)*100)/100;
    return {rows,gross,net,discount:Math.round((gross-net)*100)/100};

  function orderView(){

  function orderBody(){
    const d = state.draft, acc = account();

  function orderText(o){
    return [`Pedido ${o.id} (demostración, no enviado a HPC)`,`${account().name} · entrega: ${o.point} · para el ${o.date}`,...o.lines.map(l=>`- ${l.name} (${l.model}): ${l.boxes} ${l.boxes===1?'caja':'cajas'}, ${l.units} unidades, ${money(l.total)}`),`Total de ejemplo sin impuestos: ${money(o.net)}`,o.notes?`Notas: ${o.notes}`:''].filter(Boolean).join('\n');
  }
  function csv(orders){
    const q=v=>{const s=String(v??'');return /[",\n;]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;};
    const head=['pedido','fecha','estado','entrega','fecha_deseada','codigo','modelo','producto','cajas','unidades','precio_unitario','descuento','total_linea'];
    const rows=orders.flatMap(o=>o.lines.map(l=>[o.id,localDate(new Date(o.createdAt)),o.status,o.point,o.date,l.code,l.model,l.name,l.boxes,l.units,l.unit.toFixed(2),l.disc,l.total.toFixed(2)]));
    return [head,...rows].map(r=>r.map(q).join(',')).join('\r\n');
  }
  function download(name, text){
    const url=URL.createObjectURL(new Blob(['﻿'+text],{type:'text/csv;charset=utf-8'}));
    const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);toast(`Descargado: ${name}`);
  }
  async function copyText(text){
    try{await navigator.clipboard.writeText(text);toast('Copiado.');}
    catch{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch{}ta.remove();toast(ok?'Copiado.':'No se pudo copiar en este navegador.');}
  }

      <div class="field"><label for="restock-boxes">Cajas de ${BOX[p.id]} ${BOX[p.id]===1?'unidad':'unidades'}</label><input id="restock-boxes" class="input" type="number" inputmode="numeric" min="1" max="99" value="1" style="max-width:120px"></div>
      <div class="field"><label for="restock-note">Nota <span class="hint">(opcional)</span></label><input id="restock-note" class="input" maxlength="140" placeholder="Por ejemplo: los clientes lo piden cada semana"></div>
      <div class="actions" style="margin-top:0"><button class="btn btn-primary" type="submit">Enviar solicitud</button><button class="btn btn-ghost" type="button" data-action="restock-close">Cancelar</button></div>
      <p class="hint small">La solicitud se guarda en este navegador. El mayorista la ve aquí o en su computadora, si le pasas una copia de los datos. No se envía a HPC.</p></form>`;
  }
  function submitRestock(form){
    const p=productById(form.dataset.id), boxes=Math.max(1,Math.min(99,parseInt(form.querySelector('#restock-boxes').value,10)||1)), note=form.querySelector('#restock-note').value.trim().slice(0,140);
    const n=state.requests.reduce((m,r)=>Math.max(m,parseInt(r.id.slice(2),10)||0),0)+1;

  const REQUEST_STATUS = {pendiente:['pending','Pendiente'], atendida:['done','Agregada al pedido del mayorista'], descartada:['off','Descartada']};
  function restockView(){

      ${list.map(r=>{const p=productById(r.productId),[cls,label]=REQUEST_STATUS[r.status]||REQUEST_STATUS.pendiente;return `<tr><td><strong>${esc(r.id)}</strong></td>${collab?'':`<td data-label="Tienda">${esc(storeName(r.store))}</td>`}<td data-label="Producto">${esc(p.name)}<br><span class="hint small">${esc(p.model)} · ${BOX[p.id]} por caja</span></td><td class="num" data-label="Cajas">${fmt(r.boxes)}</td><td data-label="Fecha">${esc(new Date(r.at).toLocaleString('es-GT',{dateStyle:'short',timeStyle:'short'}))}</td><td data-label="Nota">${esc(r.note||'—')}</td><td data-label="Estado"><span class="status ${cls}">${label}</span></td>${collab?'':`<td data-label="">${r.status==='pendiente'?`<div class="row-actions"><button class="btn btn-primary btn-sm" data-action="restock-accept" data-id="${r.id}">Agregar al pedido</button><button class="btn btn-ghost btn-sm" data-action="restock-reject" data-id="${r.id}">Descartar</button></div>`:''}</td>`}</tr>`;}).join('')}

  // Lo que se está acabando (colaborador): existencias de ejemplo bajas en su tienda, con reposición desde la lista.

  // Pedido sugerido (mayorista): estimación de ejemplo con las métricas de sus tiendas
  function suggestions(){
    const acc=account(), cur=aggregate(acc.stores,0,30), rate=cur.recs?cur.accepted/cur.recs:0;
    return PRODUCTS.map(p=>{
      const recs=cur.byProduct[p.id]||0, demand=Math.round(recs*rate), stock=acc.stores.reduce((n,st)=>n+STORE_STOCK[st][p.id],0);
      const maxBoxes=Math.floor(WAREHOUSE[p.id]/BOX[p.id]), wanted=Math.ceil(Math.max(0,demand-stock)/BOX[p.id]);
      return {p,recs,demand,stock,boxes:Math.min(wanted,maxBoxes),capped:wanted>maxBoxes};
    }).filter(s=>s.boxes>0).sort((a,b)=>b.boxes*BOX[b.p.id]-a.boxes*BOX[a.p.id]);
  }
  const boxesInDraft = id => (state.draft.lines.find(l => l.id===id)||{boxes:0}).boxes;
  function ensureBoxes(id, boxes){const line=state.draft.lines.find(l=>l.id===id);if(line)line.boxes=Math.min(999,Math.max(line.boxes,boxes));else state.draft.lines.push({id,boxes:Math.min(999,boxes)});}
  function addBoxes(id, boxes){const line=state.draft.lines.find(l=>l.id===id);if(line)line.boxes=Math.min(999,line.boxes+boxes);else state.draft.lines.push({id,boxes:Math.min(999,boxes)});}
  function suggestionCard(){
    const list=suggestions(), acc=account();
    if(!list.length)return '';
    const missing=list.filter(s=>boxesInDraft(s.p.id)<s.boxes).length;
    return `<section class="card" aria-labelledby="suggest-title"><div class="section-title"><div><div class="eyebrow">Pedido sugerido</div><h2 id="suggest-title" style="font-size:18px">Para ${esc(acc.stores.map(storeName).join(' y '))} (ejemplo)</h2><p class="hint small">Estimación de ejemplo: recomendaciones de los últimos 30 días por la tasa de «Me lo llevo», menos las existencias de tus tiendas; en cajas completas y sin pasar la bodega.</p></div>${missing?`<button class="btn btn-primary" data-action="suggest-all">${icon('plus')} Agregar todo lo sugerido</button>`:'<span class="status done">Todo lo sugerido ya está en el pedido</span>'}</div>
      <div class="table-wrap"><table class="table stacked"><thead><tr><th scope="col">Producto</th><th scope="col" class="num">Recomendaciones</th><th scope="col" class="num">Demanda estimada</th><th scope="col" class="num">En tus tiendas</th><th scope="col" class="num">Sugerido</th><th scope="col"><span class="sr-only">Acción</span></th></tr></thead><tbody>
      ${list.map(s=>`<tr><td><strong>${esc(s.p.name)}</strong><br><span class="hint small">${esc(s.p.model)} · ${BOX[s.p.id]} por caja</span></td><td class="num" data-label="Recomendaciones">${fmt(s.recs)}</td><td class="num" data-label="Demanda estimada">${units(s.demand)}</td><td class="num" data-label="En tus tiendas">${units(s.stock)}</td><td class="num" data-label="Sugerido"><strong>${fmt(s.boxes)} ${s.boxes===1?'caja':'cajas'}</strong>${s.capped?'<br><span class="hint small">Limitado por la bodega</span>':''}</td><td data-label="">${boxesInDraft(s.p.id)>=s.boxes?'<span class="status done">En el pedido</span>':`<button class="btn btn-secondary btn-sm" data-action="suggest-add" data-id="${s.p.id}">Agregar</button>`}</td></tr>`).join('')}
      </tbody></table></div></section>`;
  }

  // QR para anaquel (ambos modos): enlaces de entrada de la guía con tienda, categoría y origen
  function qrView(){

    return `<section class="qr-layout">

        <p class="hint" style="margin-top:4px">Arma el enlace que abre la guía de clientes con la tienda, la categoría y el origen ya puestos, como describe el README de la guía.</p>
        <form id="qr-form" class="stack" style="margin-top:14px" novalidate>
          <div class="field"><label for="qr-base">Dirección de la guía publicada</label><input id="qr-base" class="input" inputmode="url" autocomplete="off" spellcheck="false" value="${esc(state.qr.base)}"><span class="hint small">La guía todavía no está publicada: cambia esta dirección de ejemplo por la real cuando exista.</span></div>
          <div class="grid-2">
            <div class="field"><label for="qr-store">Tienda</label>${collab?`<input id="qr-store" class="input" value="${esc(storeName(s.store))} (ejemplo)" disabled>`:`<select id="qr-store" class="input">${stores.map(id=>`<option value="${id}"${state.qr.store===id?' selected':''}>${esc(storeName(id))} (ejemplo)</option>`).join('')}</select>`}</div>
            <div class="field"><label for="qr-category">Categoría</label><select id="qr-category" class="input">${QR_CATEGORY.map(([id,label])=>`<option value="${id}"${state.qr.category===id?' selected':''}>${esc(label)}</option>`).join('')}</select></div>
          </div>
          <div class="field"><label for="qr-origin">Dónde se va a colocar</label><select id="qr-origin" class="input">${QR_ORIGIN.map(([id,label])=>`<option value="${id}"${state.qr.origin===id?' selected':''}>${esc(label)}</option>`).join('')}</select></div>
        </form>

      <section class="card qr-box" id="qr-result" aria-live="polite" aria-label="Código QR y enlace">${qrResult()}</section>
    </section>`;
  }
  function qrLink(){
    try{
      const u=new URL(state.qr.base.trim());
      if(!/^https?:$/.test(u.protocol))return null;
      u.searchParams.set('tienda',state.qr.store);
      if(state.qr.category)u.searchParams.set('categoria',state.qr.category);else u.searchParams.delete('categoria');
      u.searchParams.set('origen',state.qr.origin);
      return u.toString();
    }catch{return null;}
  }
  function qrResult(){
    const link=qrLink();
    if(!link)return `<p class="form-error" role="alert">Escribe una dirección válida que empiece con https://</p>`;
    let svg;try{svg=QR.svg(link);}catch(e){return `<p class="form-error" role="alert">${esc(e.message)}</p>`;}
    return `${svg}<p class="hint small">${state.qr.origin==='nfc'?'Para una etiqueta NFC, graba este enlace en la etiqueta. El QR sirve para probarlo con el celular.':'Escanéalo con el celular para probarlo antes de imprimir.'}</p><div class="qr-link" id="qr-url">${esc(link)}</div>
      <div class="actions" style="margin-top:0;justify-content:center"><button class="btn btn-secondary btn-sm" data-action="copy" data-text="${esc(link)}">${icon('copy')} Copiar enlace</button><button class="btn btn-secondary btn-sm" data-action="qr-download">${icon('download')} Descargar SVG</button><button class="btn btn-primary btn-sm" data-action="qr-print">Imprimir etiqueta</button></div>`;
  }
  function updateQr(){save('qr',state.qr);const box=document.getElementById('qr-result');if(box)box.innerHTML=qrResult();}
  const qrFileName = () => `qr-${state.qr.store}-${state.qr.category||'general'}-${state.qr.origin}.svg`;
  function printLabel(){

  // Generador de códigos QR sin dependencias: modo byte, corrección M, versiones 1 a 10
  // (sigue el estándar ISO/IEC 18004, con la misma estructura del generador de referencia de Nayuki).
  const QR = (() => {
    const ECC_PER_BLOCK = [0,10,16,26,18,24,16,18,22,22,26];
    const BLOCKS = [0,1,1,1,2,2,4,4,4,5,5];
    const rawModules = v => {let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36;}return r;};
    const dataCodewords = v => Math.floor(rawModules(v)/8)-ECC_PER_BLOCK[v]*BLOCKS[v];
    const mul = (x,y) => {let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x;}return z;};
    const divisor = d => {const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1];}root=mul(root,2);}return r;};
    const remainder = (data,div) => {const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>{r[i]^=mul(c,f);});}return r;};
    const alignment = v => {if(v===1)return [];const n=Math.floor(v/7)+2,size=v*4+17,step=Math.ceil((v*4+4)/(n*2-2))*2,res=[6];for(let pos=size-7;res.length<n;pos-=step)res.splice(1,0,pos);return res;};
    const MASKS=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    function penalty(mod,size){
      let score=0;
      const runs=get=>{for(let a=0;a<size;a++){let run=1;for(let b=1;b<size;b++){if(get(a,b)===get(a,b-1)){run++;if(run===5)score+=3;else if(run>5)score++;}else run=1;}}};
      runs((a,b)=>mod[a][b]);runs((a,b)=>mod[b][a]);
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=mod[y][x];if(c===mod[y][x+1]&&c===mod[y+1][x]&&c===mod[y+1][x+1])score+=3;}
      const pat=[true,false,true,true,true,false,true];
      const finderLike=(get,a,b)=>{for(let k=0;k<7;k++)if(get(a,b+k)!==pat[k])return false;const before=b>=4&&[1,2,3,4].every(k=>!get(a,b-k)),after=b+10<size&&[7,8,9,10].every(k=>!get(a,b+k));return before||after;};
      for(let a=0;a<size;a++)for(let b=0;b+7<=size;b++){if(finderLike((r,c)=>mod[r][c],a,b))score+=40;if(finderLike((r,c)=>mod[c][r],a,b))score+=40;}
      let dark=0;mod.forEach(row=>row.forEach(c=>{if(c)dark++;}));
      return score+Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;
    }
    function encode(text){
      const bytes=Array.from(new TextEncoder().encode(text));
      let v=1;for(;v<=10;v++)if(4+(v<10?8:16)+bytes.length*8<=dataCodewords(v)*8)break;
      if(v>10)throw new Error('El enlace es demasiado largo para el código QR; usa una dirección más corta.');
      const bits=[],put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1);};
      put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
      const cap=dataCodewords(v)*8;put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
      for(let pad=0xEC;bits.length<cap;pad^=0xEC^0x11)put(pad,8);
      const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b);}
      // Bloques con su corrección de errores, intercalados
      const nb=BLOCKS[v],ecl=ECC_PER_BLOCK[v],raw=Math.floor(rawModules(v)/8),nShort=nb-raw%nb,shortLen=Math.floor(raw/nb),div=divisor(ecl),blocks=[];
      for(let i=0,k=0;i<nb;i++){const dat=data.slice(k,k+shortLen-ecl+(i<nShort?0:1));k+=dat.length;const ecc=remainder(dat,div);if(i<nShort)dat.push(0);blocks.push(dat.concat(ecc));}
      const codewords=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((blk,j)=>{if(i!==shortLen-ecl||j>=nShort)codewords.push(blk[i]);});
      // Patrones fijos
      const size=v*4+17,mod=[...Array(size)].map(()=>Array(size).fill(false)),fn=[...Array(size)].map(()=>Array(size).fill(false));
      const set=(x,y,d)=>{mod[y][x]=d;fn[y][x]=true;};
      for(let i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0);}
      const finder=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size)set(xx,yy,d!==2&&d!==4);}};
      finder(3,3);finder(size-4,3);finder(3,size-4);
      const al=alignment(v),na=al.length;
      for(let i=0;i<na;i++)for(let j=0;j<na;j++){if(i===0&&j===0||i===0&&j===na-1||i===na-1&&j===0)continue;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(al[i]+dx,al[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);}
      const format=mask=>{const dat=mask;let rem=dat;for(let i=0;i<10;i++)rem=(rem<<1)^((rem>>>9)*0x537);const b=((dat<<10)|rem)^0x5412,g=i=>((b>>>i)&1)===1;
        for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
        for(let i=0;i<8;i++)set(size-1-i,8,g(i));for(let i=8;i<15;i++)set(8,size-15+i,g(i));set(8,size-8,true);};
      format(0);
      if(v>=7){let rem=v;for(let i=0;i<12;i++)rem=(rem<<1)^((rem>>>11)*0x1F25);const b=(v<<12)|rem;for(let i=0;i<18;i++){const c=((b>>>i)&1)===1,a=size-11+i%3,bb=Math.floor(i/3);set(a,bb,c);set(bb,a,c);}}
      // Datos en zigzag
      let bi=0;
      for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;if(!fn[y][x]&&bi<codewords.length*8){mod[y][x]=((codewords[bi>>>3]>>>(7-(bi&7)))&1)===1;bi++;}}}
      // Máscara con menor penalización
      const apply=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!fn[y][x]&&MASKS[m](x,y))mod[y][x]=!mod[y][x];};
      let best=0,bestScore=Infinity;
      for(let m=0;m<8;m++){apply(m);format(m);const sc=penalty(mod,size);if(sc<bestScore){bestScore=sc;best=m;}apply(m);}
      apply(best);format(best);
      return {modules:mod,version:v,mask:best};
    }
    function svg(text){
      const m=encode(text).modules,n=m.length,q=4;let d='';
      for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(m[y][x])d+=`M${x+q} ${y+q}h1v1h-1z`;
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*q} ${n+2*q}" shape-rendering="crispEdges" role="img" aria-label="Código QR del enlace"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
    }
    return {encode, svg};
  })();

  function exportData(){
    const s=state.session;
    const payload={formato:'hpc-portal-interno',version:1,exportado:new Date().toISOString(),
      desde:!s?'Pantalla de acceso':s.mode==='colaborador'?`Colaborador · ${me().name} · ${storeName(s.store)}`:`Mayorista · ${account().name}`,
      requests:state.requests,orders:state.orders,attentions:state.attentions};
    downloadFile(`portal-interno-datos-${localDate()}.json`,JSON.stringify(payload,null,1),'application/json');
  }
  // Suma registros de otra computadora. Lo repetido (mismo uid) no se duplica y gana el estado más avanzado:
  // una solicitud atendida o descartada, un pedido cancelado. Si el número ya existe aquí, el registro nuevo recibe otro.
  function mergeRecords(local, incoming, prefix, rank){
    const list=local.slice(), index=new Map(list.map((x,i)=>[x.uid,i])), res={added:0,updated:0,renamed:[]};
    const num=id=>parseInt(String(id).slice(2),10)||0;
    for(const x of incoming){
      const i=index.get(x.uid);
      if(i!==undefined){if(rank&&rank(x)>rank(list[i])){list[i]={...x,id:list[i].id};res.updated++;}continue;}
      let y=x;
      if(prefix&&list.some(z=>z.id===x.id)){y={...x,id:prefix+String(list.reduce((m,z)=>Math.max(m,num(z.id)),0)+1).padStart(4,'0')};res.renamed.push(`${x.id} → ${y.id}`);}
      list.push(y);index.set(y.uid,list.length-1);res.added++;
    }
    return {list,...res};
  }
  async function importData(file){
    let msg;
    try{
      if(file.size>5e6)throw new Error('El archivo es demasiado grande para ser una copia del portal.');
      let data;try{data=JSON.parse(await file.text());}catch{throw new Error('No se pudo leer el archivo: no es una copia del portal interno.');}
      if(!data||data.formato!=='hpc-portal-interno')throw new Error('El archivo no es una copia del portal interno.');
      const raw={r:asList(data.requests),o:asList(data.orders),a:asList(data.attentions)};
      const inc={r:raw.r.filter(validRequest).map(x=>withUid(x,'r')),o:raw.o.filter(validOrder).map(x=>withUid(x,'p')),a:raw.a.filter(validAttention).map(x=>withUid(x,'a'))};
      const ignored=raw.r.length+raw.o.length+raw.a.length-inc.r.length-inc.o.length-inc.a.length;
      const r=mergeRecords(state.requests,inc.r,'R-',x=>x.status==='pendiente'?0:1);
      const o=mergeRecords(state.orders,inc.o,'P-',x=>x.status==='cancelado'?1:0);
      const a=mergeRecords(state.attentions,inc.a);
      r.list.sort((x,y)=>x.at.localeCompare(y.at));o.list.sort((x,y)=>x.createdAt.localeCompare(y.createdAt));a.list.sort((x,y)=>x.at.localeCompare(y.at));
      const attentions=a.list.slice(-ATTENTION_LIMIT);
      if(!save('requests',r.list)||!save('orders',o.list)||!save('attentions',attentions))throw new Error('No se pudo guardar en este navegador.');
      state.requests=r.list;state.orders=o.list;state.attentions=attentions;
      const parts=[];
      if(r.added)parts.push(plural(r.added,'solicitud nueva','solicitudes nuevas'));
      if(r.updated)parts.push(plural(r.updated,'solicitud actualizada','solicitudes actualizadas'));
      if(o.added)parts.push(plural(o.added,'pedido nuevo','pedidos nuevos'));
      if(o.updated)parts.push(plural(o.updated,'pedido actualizado','pedidos actualizados'));
      if(a.added)parts.push(plural(a.added,'atención nueva','atenciones nuevas'));
      let text=parts.length?`Copia cargada: ${parts.join(', ')}.`:'La copia no traía nada nuevo: todo ya estaba en este navegador.';
      const renamed=[...r.renamed,...o.renamed];
      if(renamed.length)text+=` Cambiaron de número porque ese número ya existía aquí: ${renamed.join(', ')}.`;
      if(ignored)text+=` Se ${ignored===1?'ignoró':'ignoraron'} ${plural(ignored,'registro con datos incompletos','registros con datos incompletos')}.`;
      msg={text};
    }catch(e){msg={error:true,text:e&&e.message?e.message:'No se pudo cargar la copia.'};}
    state.dataMessage=msg;state.dataOpen=true;state.confirmReset=false;render();
    document.getElementById('data-panel')?.focus();
    toast(msg.text);
  }

  }
