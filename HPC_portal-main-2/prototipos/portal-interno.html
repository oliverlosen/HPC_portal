    const byReason = barChart({id:'reasons',title:'Motivos de «No es lo que busco»',subtitle:`${fmt(cur.rejected)} respuestas`,rows:REASONS.map((r,i)=>({label:r,value:cur.reasons[i]})).sort((a,b)=>b.value-a.value)});
    const byProduct = collab ? '' : barChart({id:'products',wide:true,title:'Productos recomendados',subtitle:'Para planear compras por volumen',rows:PRODUCTS.map(p=>({label:`${p.name} · ${p.model}`,value:cur.byProduct[p.id]||0})).sort((a,b)=>b.value-a.value)});
    const count = t => t.buckets.reduce((x,y)=>x+y,0);
    const avgCur = count(cur.time) ? cur.time.sum/count(cur.time) : 0, avgPrev = count(prev.time) ? prev.time.sum/count(prev.time) : 0;
    const tDelta = avgPrev ? (avgCur-avgPrev)/avgPrev : 0;
    const timeCard = barChart({id:'time',title:'Tiempo hasta la recomendación',subtitle:'Recomendaciones según cuánto tardó el cliente en recibirla',colors:['var(--ord-1)','var(--ord-2)','var(--ord-3)','var(--ord-4)'],rows:TIME_BUCKETS.map((label,i)=>({label,value:cur.time.buckets[i]})),
      stat:`<div class="time-stat"><span class="k-value">${seconds(avgCur)}</span><span class="k-sub">en promedio</span>${avgPrev?`<span class="delta ${tDelta<=0?'good':'bad'}">${tDelta<=0?'▼':'▲'} ${pct(Math.abs(tDelta))} vs. los ${P} días anteriores</span>`:''}</div>`,
      note:'Desde que el cliente inicia la guía hasta que ve su recomendación; la guía ya registra este dato (elapsedSeconds).'});
    const outcomeRows = collab ? [...OUTCOMES.map(([id,label])=>({label,value:mine.filter(a=>a.outcome===id).length})),{label:'Sin resultado registrado',value:mine.filter(a=>!a.outcome).length}].filter((r,i)=>i<OUTCOMES.length||r.value>0).sort((a,b)=>b.value-a.value) : [];
    const outcomesChart = collab ? barChart({id:'outcomes',title:'Cómo terminaron tus atenciones',subtitle:`${fmt(mine.length)} ${mine.length===1?'atención':'atenciones'} en este navegador`,rows:outcomeRows,note:'«Compró» lo registra el colaborador; no es una compra verificada con factura.'}) : '';
    const unknown = storeAtt.filter(a=>!a.by).length;
    const teamChart = collab ? barChart({id:'team',title:'Atenciones por colaborador',subtitle:`${storeName(s.store)} (ejemplo) · en este navegador`,rows:[...COLLABORATORS.filter(c=>c.store===s.store).map(c=>({label:`${c.name} (ejemplo)`,value:storeAtt.filter(a=>a.by===c.id).length})),...(unknown?[{label:'Antes de los códigos por persona',value:unknown}]:[])],note:'Cada colaborador entra con su código personal y sus atenciones quedan a su nombre.'}) : '';
    const goalsBlock = `<div class="${collab?'grid-2':'stack'}" style="margin-bottom:16px"><section class="card" aria-labelledby="pilot-goals"><h3 id="pilot-goals" style="font-size:15.5px">Metas del piloto</h3><p class="hint small" style="margin:2px 0 14px">Los indicadores de la presentación del proyecto, con las cifras de ejemplo de ${esc(scope)}, últimos ${P} días.</p><div class="goals">${pilotGoals(cur).map(goalRow).join('')}</div></section>${collab?`<section class="card" aria-labelledby="my-goals"><h3 id="my-goals" style="font-size:15.5px">Tus metas del mes · ${esc(me().name)} (ejemplo)</h3><p class="hint small" style="margin:2px 0 14px">Con las atenciones que registras en este navegador desde el día 1. Las metas son de ejemplo.</p><div class="goals">${personGoals(state.attentions,s.collaborator).map(goalRow).join('')}</div></section>`:''}</div>`;
    const assisted = mine.filter(a=>a.via==='preguntas').length, withCode = mine.filter(a=>a.via==='codigo').length;
    const attentions = collab ? `<section class="card"><div class="section-title" style="margin-bottom:0"><div><h3 style="font-size:15.5px">Atenciones que registraste</h3><p class="hint small">Solo en este navegador, últimos ${P} días${withCode?` · ${fmt(withCode)} con código de atención`:''}${assisted?` · ${fmt(assisted)} sin celular`:''}.</p></div><div class="k-value" style="font:700 28px/1 'DM Sans',sans-serif">${fmt(mine.length)}</div></div>${mine.length?`<ul class="att-list">${mine.slice(-5).reverse().map(a=>{const p=productById(a.productId);return `<li><span>${esc(p?p.name:'Sin opción en la muestra')} <span class="hint small">${p?`${esc(a.code)} · `:''}${esc(outcomeLabel(a))}${a.via==='preguntas'?' · sin celular':a.via==='codigo'?' · con código de atención':''}</span></span><span class="hint small">${esc(new Date(a.at).toLocaleString('es-GT',{dateStyle:'short',timeStyle:'short'}))}</span></li>`;}).join('')}</ul>`:'<p class="hint small" style="margin-top:8px">Usa «Registrar atención» en Atender cliente para sumarlas aquí.</p>'}</section>` : '';
    return `<section><div class="section-title"><div><div class="eyebrow">Métricas del piloto</div><h2>${collab?'Cómo va tu tienda':'Cómo van tus tiendas'}</h2><p class="hint">Datos de ejemplo generados para el prototipo; la medición real del piloto sigue pendiente.</p></div></div>
      ${filtersRow}${kpis}${goalsBlock}<div class="viz-grid">${funnel}${timeCard}${byNeed}${byReason}${outcomesChart}${teamChart}${byProduct}</div>${attentions?`<div style="margin-top:16px">${attentions}</div>`:''}</section>`;
  }

  // Metas del piloto con las cifras de un periodo (aggregate). Aceptación: «Me lo llevo» o WhatsApp sobre las recomendaciones.
  function pilotGoals(z){
    const n = z.time.buckets.reduce((x,y)=>x+y,0), avg = n ? z.time.sum/n : 0, acc = z.recs ? (z.accepted+z.whatsapp)/z.recs : 0;
    return [
      {id:'acceptance', label:'Aceptación de recomendaciones', text:pct(acc), targetText:`${pct(PILOT_GOALS.acceptance)} o más`, met:acc>=PILOT_GOALS.acceptance, progress:Math.min(1, acc/PILOT_GOALS.acceptance)},
      {id:'time', label:'Tiempo hasta la recomendación', text:avg?seconds(avg):'—', targetText:'menos de 1 minuto', met:avg>0&&avg<PILOT_GOALS.seconds, progress:avg?Math.min(1, PILOT_GOALS.seconds/avg):0},
      {id:'leads', label:'Clientes que dejan sus datos de contacto', text:'sin medir', targetText:`${pct(PILOT_GOALS.leads)} de quienes escanean`, met:null, progress:0, note:'La guía todavía no los pide; se medirá en la versión del piloto.'}
    ];
  }
  // Metas del colaborador en el mes en curso, con las atenciones que registró en este navegador.
  function personGoals(attentions, who, now = new Date()){
    const start = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
    const mine = attentions.filter(a => a.by===who && Date.parse(a.at)>=start);
    const count = {attentions:mine.length, withCode:mine.filter(a=>a.via==='codigo').length, bought:mine.filter(a=>a.outcome==='compro').length};
    return PERSON_GOALS.map(([id,label,target]) => ({id, label, value:count[id], text:`${fmt(count[id])} de ${fmt(target)}`, targetText:`${fmt(target)} este mes`, met:count[id]>=target, progress:Math.min(1, count[id]/target)}));
  }
  function goalRow(g){
    const status = g.met===null ? `<span class="badge badge-pending">${icon('info')} Por medir</span>` : g.met ? `<span class="badge badge-ok">${icon('check')} Cumple</span>` : `<span class="badge badge-off">${icon('info')} Todavía no</span>`;
    return `<div class="goal"><div class="goal-label"><strong>${esc(g.label)}</strong><small>Ahora: ${esc(g.text)} · Meta: ${esc(g.targetText)}${g.note?` · ${esc(g.note)}`:''}</small></div>${status}<div class="goal-track" role="img" aria-label="${esc(g.label)}: ${esc(g.text)}; meta: ${esc(g.targetText)}"><span class="goal-fill" style="--p:${g.progress.toFixed(3)}"></span></div></div>`;
  }

  // Modo colaborador: análisis del proyecto. Cifras resumidas que presentó el equipo (fase 3), junto a lo que recomienda la guía.
  function analysisView(){
    const A = ANALYSIS, s = state.session, cur = aggregate([s.store], 0, 30);
    const num = (n, d=1) => n.toLocaleString('es-GT', {minimumFractionDigits:d, maximumFractionDigits:d});
    const pp = n => `${n<0?'−':'+'}${num(Math.abs(n),2)} pp`;
    const kpis = `<div class="kpis">
      <div class="kpi hero"><div class="k-label">Ventas de HPC</div><div class="k-value">+${esc(pct(A.salesGrowth))}</div><div class="k-sub">${esc(A.salesPeriod)}</div></div>
      <div class="kpi"><div class="k-label">Participación de mercado general</div><div class="k-value">${num(A.share.to)} %</div><div class="k-sub">Antes ${num(A.share.from)} % · ${A.share.to<A.share.from?'−':'+'}${num(Math.abs(A.share.to-A.share.from))} pp</div></div>
      <div class="kpi"><div class="k-label">Categorías que perdieron participación</div><div class="k-value">${A.lost.length} de ${A.categories}</div><div class="k-sub">En Cemaco, 2025 a 2026</div></div>
    </div>`;
    const chart = barChart({id:'lost',wide:true,title:'Pérdida de participación por categoría',subtitle:'Puntos porcentuales, Cemaco 2025 a 2026',rows:A.lost.map(([label,v])=>({label,value:Math.abs(v),text:pp(v)})),note:'Fuente: análisis del equipo del proyecto (fase 3). Cifras resumidas que se presentaron; no son datos de un sistema de HPC.'});
    const rows = A.lost.map(([label,v,cat])=>{const p=PROJECTS.find(x=>x.id===cat);return `<tr><td>${esc(label)}</td><td class="num">${esc(pp(v))}</td><td>${p?esc(p.name):'<span class="hint">Fuera de la muestra de la guía</span>'}</td><td class="num">${p?esc(fmt(cur.byCat[cat]||0)):'—'}</td></tr>`;}).join('');
    return `<section><div class="section-title"><div><div class="eyebrow">Análisis del proyecto</div><h2>HPC en Cemaco</h2><p class="hint">HPC creció en ventas, pero no ganó participación de mercado. En Cemaco hay oportunidad de mejorar la asesoría, la visibilidad de los productos y la información sobre garantías.</p></div></div>
      ${kpis}<div class="viz-grid">${chart}</div>
      <section class="card" style="margin-top:16px" aria-labelledby="guide-link"><h3 id="guide-link" style="font-size:15.5px">Cómo se relaciona con la guía</h3><p class="hint small" style="margin:2px 0 12px">Las categorías que perdieron participación y cuántas recomendaciones de esa necesidad dio la guía en ${esc(storeName(s.store))} en los últimos 30 días (cifras de ejemplo del prototipo).</p>
        <div class="table-wrap" tabindex="0" role="region" aria-labelledby="guide-link"><table class="table"><thead><tr><th scope="col">Categoría</th><th scope="col" class="num">Cambio</th><th scope="col">Necesidad en la guía</th><th scope="col" class="num">Recomendaciones (ejemplo)</th></tr></thead><tbody>${rows}</tbody></table></div></section></section>`;
  }

  /* ---------- Render y eventos ---------- */
  const TITLES = {atender:'Atender cliente',productos:'Productos',catalogo:'Catálogo mayorista',pedido:'Nuevo pedido',pedidos:'Mis pedidos',reposicion:'Reposición',qr:'QR para anaquel',servicio:'Servicio y garantía',metricas:'Métricas',analisis:'Análisis del proyecto'};
  function mountSmartGuide(){
    if(!state.session||state.tab!=='atender')return;
    const el=document.getElementById('smart-guide-slot');if(!el||!window.HPC_SMART_UI)return;
    window.HPC_SMART_UI.mount(el,{data:{products:PRODUCTS,projects:PROJECTS,frequency:FREQUENCY,priorities:PRIORITY,centers:SUPPORT.centers,centerHours:SUPPORT.hours},image,
      onRecommend(answers){state.answers=answers;state.attendMode='preguntas';render();focusLookupResult();},
      onManual(){state.attendMode='preguntas';render();document.getElementById('questions-form')?.scrollIntoView({block:'start'});},
      onRoute(intent){if(['register','tools'].includes(intent)){if(window.HPC_SWITCH_PORTAL)window.HPC_SWITCH_PORTAL('cliente',intent);else toast('El registro de compra se encuentra en el portal del cliente.');return;}if(['help','unknown'].includes(intent)){state.attendMode='preguntas';render();document.getElementById('questions-form')?.scrollIntoView({block:'start'});return;}setTab('servicio');}
    });
  }
  function enterDemo(mode,profile){
    if(!window.HPC_BOOT)return;
    const oldMode=state.session?.mode;
    const person=COLLABORATORS.find(p=>p.id===profile)||COLLABORATORS[0], company=ACCOUNTS.find(p=>p.id===profile)||ACCOUNTS[0];
    state.session=mode==='colaborador'?{mode,collaborator:person.id,store:person.store}:{mode:'mayorista',account:company.id};
    save('session',state.session);
    if(oldMode!==state.session.mode||!state.tab)state.tab=mode==='colaborador'?'atender':'catalogo';
    state.menuOpen=false;render();
  }
  function render(){
    tip.hidden = true;
    root.innerHTML = state.session ? shell((state.tab==='atender'?'<div id="smart-guide-slot"></div>':'')+view()) : loginView();
    mountSmartGuide();
    document.title = (state.session ? `${TITLES[state.tab]||'Portal'} · ` : '') + 'Portal interno · HPC Smart Guide (prototipo)';
  }
  function setTab(tab){state.tab=tab;state.menuOpen=false;state.orderError='';state.confirmCancel=null;state.attendFor=null;state.restockFor=null;state.dataOpen=false;state.confirmReset=false;state.dataMessage=null;render();window.scrollTo(0,0);document.getElementById('main')?.focus({preventScroll:true});}
  function persistDraft(){save('draft', state.draft);}
  function addLine(id){
    const line=state.draft.lines.find(l=>l.id===id);
    if(line)line.boxes=Math.min(999,line.boxes+1);else state.draft.lines.push({id,boxes:1});
    persistDraft();
    const n=state.draft.lines.find(l=>l.id===id).boxes;
    render();
    document.querySelector(`[data-action="add-line"][data-id="${id}"]`)?.focus();
    toast(`${productById(id).name}: ${n} ${n===1?'caja':'cajas'} en el pedido.`);
  }
  function setQty(id, n, refocus){
    const line=state.draft.lines.find(l=>l.id===id);if(!line)return;
    line.boxes=Math.max(1,Math.min(999,Number.isFinite(n)?Math.round(n):1));
    persistDraft();render();
    if(refocus)document.querySelector(refocus)?.focus();
  }
  function login(){
    const mode=state.loginMode, code=(document.getElementById('login-code')?.value||'').trim().toUpperCase();
    const person=mode==='colaborador'?collaboratorByCode(code):null;
    if(mode==='colaborador'?!person:code!==WHOLESALE_CODE){state.loginError=mode==='colaborador'?'Ese código no es de ningún colaborador. Usa uno de los códigos de demostración que aparecen abajo.':'El código no es válido para el modo mayorista. Usa el código de demostración que aparece abajo.';render();document.getElementById('login-code')?.focus();return;}
    const session={mode,since:new Date().toISOString()};
    if(person){session.store=person.store;session.collaborator=person.id;}else session.account=state.loginAccount;
    if(!save('session',session))return;
    state.session=session;state.loginError='';state.search='';state.category='all';state.lookup='';state.storeFilter='mine';state.attendMode='codigo';state.answers={};
    setTab(mode==='colaborador'?'atender':'catalogo');
  }
  function confirmOrder(){
    const d=state.draft;
    state.orderError=!d.lines.length?'Agrega al menos un producto.':!d.point?'Selecciona el punto de entrega.':(!d.date||d.date<localDate())?'Elige una fecha de entrega de hoy en adelante.':'';
    if(state.orderError){render();document.querySelector('.form-error')?.scrollIntoView({block:'center'});return;}
    const t=totals(d.lines), n=state.orders.reduce((m,o)=>Math.max(m,parseInt(o.id.slice(2),10)||0),0)+1;
    const order={id:'P-'+String(n).padStart(4,'0'),uid:newUid(),createdAt:new Date().toISOString(),account:state.session.account,point:d.point,date:d.date,notes:d.notes.trim(),status:'confirmado',
      lines:t.rows.map(r=>({id:r.p.id,code:r.p.code,model:r.p.model,name:r.p.name,boxes:r.boxes,units:r.units,unit:r.unit,disc:r.disc,total:r.total})),gross:t.gross,discount:t.discount,net:t.net};
    const orders=[...state.orders,order];
    if(!save('orders',orders))return;
    state.orders=orders;state.draft={lines:[],point:'',date:'',notes:''};persistDraft();state.openOrder=order.id;
    setTab('pedidos');toast(`Pedido ${order.id} guardado en este navegador. No se envió a HPC.`);
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-action]'); if(!b) return;
    const id = b.dataset.id, a = b.dataset.action;
    if(a==='tab')setTab(b.dataset.tab);
    else if(a==='toggle-menu'){state.menuOpen=!state.menuOpen;document.querySelector('.sidebar')?.classList.toggle('open',state.menuOpen);document.querySelector('.menu-shade')?.classList.toggle('open',state.menuOpen);document.querySelector('.mobile-menu')?.setAttribute('aria-expanded',String(state.menuOpen));if(state.menuOpen)document.querySelector('.nav-button[aria-current="page"]')?.focus();}
    else if(a==='theme'){if(window.HPC_SET_THEME){window.HPC_SET_THEME(b.dataset.value);return;}state.theme=b.dataset.value;save('theme',state.theme);applyTheme();document.querySelectorAll('[data-action="theme"]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.value===state.theme)));}
    else if(a==='logout'){if(window.HPC_SWITCH_PORTAL){window.HPC_SWITCH_PORTAL('inicio');return;}state.session=null;drop('session');state.tab=null;state.menuOpen=false;state.loginError='';state.dataOpen=false;state.confirmReset=false;state.dataMessage=null;render();}
    else if(a==='try-code'||a==='open-product'){state.lookup=b.dataset.code;state.attendMode='codigo';if(state.tab!=='atender')setTab('atender');else{render();focusLookupResult();}}
    else if(a==='attend-open'){state.attendFor=state.attendFor===id?null:id;state.restockFor=null;render();document.querySelector('[data-action="attend-save"]')?.focus();}
    else if(a==='attend-mode'){state.attendMode=b.dataset.mode;state.attendFor=null;state.restockFor=null;render();document.querySelector(`[data-action="attend-mode"][data-mode="${state.attendMode}"]`)?.focus();}
    else if(a==='answers-reset'){state.answers={};state.attendFor=null;state.restockFor=null;render();document.querySelector('input[name="q-project"]')?.focus();}
    else if(a==='attend-save'){
      // Sin producto cuando la muestra no cubre la necesidad (atención sin celular derivada a un asesor)
      const p=productById(id),entry={uid:newUid(),productId:p?p.id:null,code:p?p.code:'',store:state.session.store,by:state.session.collaborator,at:new Date().toISOString(),outcome:b.dataset.outcome};
      if(b.dataset.chosen)entry.chosenId=b.dataset.chosen;
      const coded=state.attendMode==='codigo'?decodeAttention(state.lookup):null;
      if(state.attendMode==='preguntas'){const s=state.answers;entry.via='preguntas';entry.answers={project:s.project,material:s.material,frequency:s.frequency,priority:s.priority};}
      else if(coded){entry.via='codigo';entry.answers=coded;}
      const list=[...state.attentions,entry].slice(-ATTENTION_LIMIT);
      if(save('attentions',list)){
        state.attentions=list;state.attendFor=null;if(entry.outcome==='sin-existencias'&&p)state.restockFor=p.id;
        render();if(state.restockFor)document.getElementById('restock-boxes')?.focus();
        toast(`Atención registrada: ${outcomeLabel(entry)}.${entry.outcome==='sin-existencias'?' Puedes pedir reposición aquí mismo.':''}`);
      }
    }
    else if(a==='restock-open'){state.restockFor=state.restockFor===id?null:id;state.attendFor=null;render();document.getElementById('restock-boxes')?.focus();}
    else if(a==='restock-close'){state.restockFor=null;render();}
    else if(a==='restock-accept'){
      const req=state.requests.find(r=>r.id===id);
      if(req&&req.status==='pendiente'){
        const list=state.requests.map(r=>r.id===id?{...r,status:'atendida',handledAt:new Date().toISOString(),account:state.session.account}:r);
        if(save('requests',list)){state.requests=list;addBoxes(req.productId,req.boxes);persistDraft();render();toast(`${req.id}: ${req.boxes} ${req.boxes===1?'caja agregada':'cajas agregadas'} a tu nuevo pedido.`);}
      }
    }
    else if(a==='restock-reject'){const list=state.requests.map(r=>r.id===id?{...r,status:'descartada',handledAt:new Date().toISOString(),account:state.session.account}:r);if(save('requests',list)){state.requests=list;render();toast(`Solicitud ${id} descartada.`);}}
    else if(a==='suggest-add'){const s=suggestions().find(x=>x.p.id===id);if(s){ensureBoxes(id,s.boxes);persistDraft();render();toast(`${s.p.name}: ${boxesInDraft(id)} ${boxesInDraft(id)===1?'caja':'cajas'} en el pedido.`);}}
    else if(a==='suggest-all'){const list=suggestions();list.forEach(s=>ensureBoxes(s.p.id,s.boxes));persistDraft();render();toast(`Se agregó lo sugerido: ${list.length} ${list.length===1?'producto':'productos'}.`);}
    else if(a==='qr-download'){const link=qrLink();if(link)downloadFile(qrFileName(),'<?xml version="1.0" encoding="UTF-8"?>\n'+QR.svg(link),'image/svg+xml');}
    else if(a==='qr-print')printLabel();
    else if(a==='data-open'){state.dataOpen=!state.dataOpen;state.confirmReset=false;state.dataMessage=null;render();if(state.dataOpen)document.getElementById('data-panel')?.focus();}
    else if(a==='data-close'){state.dataOpen=false;state.confirmReset=false;state.dataMessage=null;render();document.querySelector('[data-action="data-open"]')?.focus();}
    else if(a==='data-export')exportData();
    else if(a==='data-import')document.getElementById('data-file')?.click();
    else if(a==='data-reset-ask'){state.confirmReset=true;state.dataMessage=null;render();document.querySelector('[data-action="data-reset"]')?.focus();}
    else if(a==='data-reset-cancel'){state.confirmReset=false;render();document.querySelector('[data-action="data-reset-ask"]')?.focus();}
    else if(a==='data-reset')resetData();
    else if(a==='copy')copyText(b.dataset.text);
    else if(a==='category'){state.category=b.dataset.category;document.querySelectorAll('[data-action="category"]').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.category===state.category)));document.getElementById('results').innerHTML=results();}
    else if(a==='add-line')addLine(id);
    else if(a==='qty'){const line=state.draft.lines.find(l=>l.id===id);if(line)setQty(id,line.boxes+Number(b.dataset.delta),`[data-action="qty"][data-id="${id}"][data-delta="${b.dataset.delta}"]`);}
    else if(a==='remove-line'){const p=productById(id);state.draft.lines=state.draft.lines.filter(l=>l.id!==id);persistDraft();render();toast(`${p.name} se quitó del pedido.`);}
    else if(a==='clear-draft'){state.draft={lines:[],point:'',date:'',notes:''};persistDraft();render();toast('Pedido vaciado.');}
    else if(a==='view-order'){state.openOrder=state.openOrder===id?null:id;render();}
    else if(a==='repeat-order'){const o=state.orders.find(x=>x.id===id);state.draft.lines=o.lines.filter(l=>productById(l.id)).map(l=>({id:l.id,boxes:l.boxes}));persistDraft();setTab('pedido');toast(`Pedido ${id} copiado al nuevo pedido.`);}
    else if(a==='ask-cancel'){state.confirmCancel=id;render();document.querySelector(`[data-action="cancel-order"][data-id="${id}"]`)?.focus();}
    else if(a==='cancel-order'){const orders=state.orders.map(o=>o.id===id?{...o,status:'cancelado'}:o);if(save('orders',orders)){state.orders=orders;state.confirmCancel=null;render();toast(`Pedido ${id} cancelado.`);}}
    else if(a==='copy-order')copyText(orderText(state.orders.find(o=>o.id===id)));
    else if(a==='csv-order')download(`pedido-${id}.csv`,csv([state.orders.find(o=>o.id===id)]));
    else if(a==='csv-all')download('pedidos-demostracion.csv',csv(myOrders()));
    else if(a==='period'){state.period=Number(b.dataset.period);render();document.querySelector(`[data-action="period"][data-period="${state.period}"]`)?.focus();}
    else if(a==='toggle-table'){const t=document.getElementById(b.dataset.target),open=t.hidden;t.hidden=!open;b.setAttribute('aria-expanded',String(open));b.textContent=open?'Ocultar tabla':'Ver tabla';}
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if(t.name==='mode'){state.loginMode=t.value;state.loginError='';render();document.querySelector(`input[name="mode"][value="${t.value}"]`)?.focus();}
    else if(t.id==='login-account')state.loginAccount=t.value;
    else if(t.id==='store-filter'){state.storeFilter=t.value;render();document.getElementById('store-filter')?.focus();}
    else if(t.dataset.qty)setQty(t.dataset.qty,parseInt(t.value,10),`[data-qty="${t.dataset.qty}"]`);
    else if(t.id==='o-point'){state.draft.point=t.value;persistDraft();}
    else if(t.id==='o-date'){state.draft.date=t.value;persistDraft();}
    else if(t.id==='qr-store'||t.id==='qr-category'||t.id==='qr-origin'){state.qr[t.id.slice(3)]=t.value;updateQr();}
    else if(t.name&&t.name.startsWith('q-')){
      // Respuestas de la atención sin celular; cambiar la necesidad borra el material, como en la guía
      const key=t.name.slice(2), before=answersComplete(state.answers)?(chooseProduct(state.answers)||{id:'ninguno'}).id:null;
      if(key==='project'&&state.answers.project!==t.value){state.answers={...state.answers,project:t.value};delete state.answers.material;}
      else state.answers={...state.answers,[key]:t.value};
      state.attendFor=null;state.restockFor=null;render();
      document.querySelector(`input[name="${t.name}"][value="${t.value}"]`)?.focus();
      if(answersComplete(state.answers)){const p=chooseProduct(state.answers);if((p?p.id:'ninguno')!==before)toast(p?`La guía recomienda: ${p.name} (${p.model}).`:'La muestra no tiene una opción para esta necesidad: deriva al cliente con un asesor de HPC.');}
    }
    else if(t.id==='data-file'){const f=t.files&&t.files[0];if(f)importData(f);}
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if(t.id==='search'){state.search=t.value;document.getElementById('results').innerHTML=results();}
    else if(t.id==='o-notes'){state.draft.notes=t.value;persistDraft();}
    else if(t.id==='qr-base'){state.qr.base=t.value;updateQr();}
  });
  document.addEventListener('submit', e => {
    e.preventDefault();
    if(e.target.id==='login-form')login();
    else if(e.target.id==='lookup-form'){state.lookup=document.getElementById('lookup').value;render();focusLookupResult();}
    else if(e.target.id==='order-form')confirmOrder();
    else if(e.target.id==='restock-form')submitRestock(e.target);
  });
  // Escape cierra el menú del teléfono y devuelve el foco al botón ☰.
  document.addEventListener('keydown', e => {if(e.key==='Escape'&&state.menuOpen){state.menuOpen=false;render();document.querySelector('.mobile-menu')?.focus();}});
  // Tooltip de las gráficas: el valor primero y la etiqueta después; también con el teclado.
  function showTip(el){
    tip.querySelector('strong').textContent=el.dataset.tipValue;tip.querySelector('span').textContent=el.dataset.tipLabel;tip.hidden=false;
    const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
    tip.style.left=Math.max(8,Math.min(r.left+Math.min(r.width,220)/2-w/2,innerWidth-w-8))+'px';
    tip.style.top=(r.top-h-8<8?r.bottom+8:r.top-h-8)+'px';
  }
  document.addEventListener('pointerover', e => {const el=e.target.closest('[data-tip-value]');if(el)showTip(el);});
  document.addEventListener('pointerout', e => {if(e.target.closest('[data-tip-value]'))tip.hidden=true;});
  document.addEventListener('focusin', e => {const el=e.target.closest('[data-tip-value]');if(el)showTip(el);else tip.hidden=true;});
  document.addEventListener('scroll', () => {tip.hidden=true;}, {passive:true});
  // Si una foto externa no carga, se muestra el icono de su categoría.
  document.addEventListener('error', e => {
    const im=e.target;if(!(im instanceof HTMLImageElement)||im.dataset.fallback)return;im.dataset.fallback='1';
    const p=productById(im.dataset.product);
    im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="120" height="120" fill="none" stroke="#e57b45" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="${ICONS[CATEGORY_ICON[p&&p.category]]||ICONS.box}"/></svg>`);
  }, true);

  window.HPC_PORTAL = {chooseProduct, reasonFor, candidatesFor, encodeAttention, decodeAttention, mergeRecords, totals, csv, aggregate, collaborators:COLLABORATORS, collaboratorByCode, validAttention, pilotGoals, personGoals, analysis:ANALYSIS, products:PRODUCTS, projects:PROJECTS, frequency:FREQUENCY, priority:PRIORITY, questions:QUESTIONS, support:SUPPORT, stores:STORES, qrCategories:QR_CATEGORY, qr:QR,
    enterDemo,accounts:ACCOUNTS,setTheme(value){state.theme=value;save('theme',value);applyTheme();render();},prepareSwitch(){persistDraft();state.menuOpen=false;render();},suggestions:()=>state.session&&state.session.mode==='mayorista'?suggestions():[], version:GUIDE_VERSION};
  if(window.HPC_BOOT)enterDemo(window.HPC_BOOT.mode||'colaborador',window.HPC_BOOT.profile);else render();
})();
</script>
</body>
</html>
